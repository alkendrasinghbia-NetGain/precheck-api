services:
  - type: web
    name: precheck-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PRECHECK_SECRET
        generateValue: true
      - key: PRECHECK_API_KEY
        sync: false
      - key: PRECHECK_EPIC_PRIVATE_KEY
        sync: false
