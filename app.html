<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NetGain Innovations — Oncology RCM Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: 'var(--ink)', sub: 'var(--sub)', line: 'var(--line)', page: 'var(--page)',
          card: 'var(--card)', chip: 'var(--chip)', hoverbg: 'var(--hover)',
          accent: 'var(--accent)', accentbg: 'var(--accent-bg)', accentsel: 'var(--accent-sel)',
          okt: 'var(--okt)', okbg: 'var(--okbg)',
          warnt: 'var(--warnt)', warnbg: 'var(--warnbg)',
          badt: 'var(--badt)', badbg: 'var(--badbg)',
        },
        fontFamily: {
          sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
          mono: ['ui-monospace', 'Cascadia Code', 'Consolas', 'monospace'],
        },
      }
    }
  }
</script>
<style>
  :root {
    --page:#F6F7F9; --card:#FFFFFF; --ink:#1A2233; --sub:#647080; --line:#E5E8EE;
    --chip:#F1F5F9; --hover:#F8FAFC;
    --accent:#2F5FE3; --accent-bg:#EAF0FD; --accent-sel:#EFF4FE;
    --okt:#16794C; --okbg:#E5F5EC; --warnt:#92600A; --warnbg:#FCF0DC; --badt:#B3261E; --badbg:#FCE8E6;
  }
  body[data-accent="indigo"] { --accent:#6D28D9; --accent-bg:#F0EAFD; --accent-sel:#F5F0FE; }
  body[data-accent="orange"] { --accent:#EA580C; --accent-bg:#FDEBDD; --accent-sel:#FEF3EA; }
  body.dark {
    /* Softer, lower-contrast dark theme: slate-blue surfaces, muted status
       tints (status colour carried by text, not by loud fills). */
    --page:#131722; --card:#1A2030; --ink:#DCE3EF; --sub:#8D9AAF; --line:#2A3346;
    --chip:#222B3C; --hover:#202839;
    --accent:#7BA2F7; --accent-bg:#1E2942; --accent-sel:#1C2436;
    /* Status surfaces are neutral in dark mode — colour is carried by the
       text and a hairline outline, so tiles read as cards, not warning lights. */
    --okt:#6FD3A6; --warnt:#E7C486; --badt:#F0968F;
    --okbg:#1E2637; --warnbg:#1E2637; --badbg:#1E2637;
  }
  body.dark .bg-okbg   { border:1px solid rgba(111,211,166,.28); }
  body.dark .bg-warnbg { border:1px solid rgba(231,196,134,.28); }
  body.dark .bg-badbg  { border:1px solid rgba(240,150,143,.28); }
  /* Pills sit on card surfaces — keep them flat and quiet */
  body.dark span.bg-okbg, body.dark span.bg-warnbg, body.dark span.bg-badbg,
  body.dark span.bg-accentbg { background:#232C3E; }
  body.dark[data-accent="indigo"] { --accent:#A98BF5; --accent-bg:#272042; --accent-sel:#211C36; }
  body.dark[data-accent="orange"] { --accent:#F5A472; --accent-bg:#332318; --accent-sel:#2A1E15; }
  body { background: var(--page); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body class="text-ink font-sans">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// URL params let a deployed copy point at a hosted backend: app.html?api=https://...&key=...
const _qp = new URLSearchParams(location.search);
if (_qp.get("api")) localStorage.setItem("ng_api", _qp.get("api"));
if (_qp.get("key")) localStorage.setItem("ng_key", _qp.get("key"));
const DEFAULT_API_BASE = localStorage.getItem("ng_api") || "http://localhost:8000";

async function api(base, path, options) {
  const headers = { "Content-Type": "application/json" };
  const user = localStorage.getItem("ng_user");
  const key = localStorage.getItem("ng_key");
  const token = localStorage.getItem("ng_token");
  if (user) headers["X-User"] = user;
  if (key) headers["X-API-Key"] = key;
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(base + path, { headers, ...options });
  // Any 401 outside the sign-in endpoints means the stored session is dead —
  // clear it and fall back to the login screen.
  const isLoginCall = path.startsWith("/v1/auth/login") || path.startsWith("/v1/auth/mfa/verify")
    || path.startsWith("/v1/auth/mfa/demo-code") || path.startsWith("/v1/auth/mfa/resend-sms");
  if (res.status === 401 && !isLoginCall) {
    localStorage.removeItem("ng_token");
    window.dispatchEvent(new Event("ng-auth-expired"));
  }
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
  return res.json();
}

// ---------------------------------------------------------------- helpers
function Pill({ children, tone }) {
  const tones = {
    ok: "bg-okbg text-okt", warn: "bg-warnbg text-warnt", bad: "bg-badbg text-badt",
    blue: "bg-accentbg text-accent", gray: "bg-chip text-sub",
  };
  return <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap ${tones[tone] || tones.gray}`}>{children}</span>;
}
function riskTone(l) { return l === "LOW" ? "ok" : l === "MEDIUM" ? "warn" : "bad"; }
function riskWord(l) { return l === "LOW" ? "Low" : l === "MEDIUM" ? "Medium" : l === "HIGH" ? "High" : "Critical"; }
function readyTone(s) { return s === "READY" ? "ok" : s === "ACTION_NEEDED" ? "warn" : "bad"; }
// Pre-Visit only: traffic-light vocabulary for the scheduling queue
function readyWord(s) { return s === "READY" ? "Go" : s === "ACTION_NEEDED" ? "Caution" : "Stop"; }
function TrafficLegend() {
  return (
    <div className="flex items-center gap-3 text-[11px] text-sub mt-3 pt-3 border-t border-line flex-wrap">
      <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-okt"></span><b className="text-okt">Go</b> — clear to proceed</span>
      <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-warnt"></span><b className="text-warnt">Caution</b> — resolve before service</span>
      <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-badt"></span><b className="text-badt">Stop</b> — will deny as submitted</span>
    </div>
  );
}
function statusTone(s) { return s === "RESOLVED" ? "ok" : s === "WAIVED" ? "gray" : s === "IN_PROGRESS" ? "warn" : "bad"; }
function money(n) { return "$" + Number(n || 0).toLocaleString(); }

function Card({ children, className }) {
  return <div className={`bg-card border border-line rounded-xl ${className || ""}`}>{children}</div>;
}
function MonoChip({ children }) {
  return <span className="font-mono text-xs bg-chip text-sub px-2 py-0.5 rounded whitespace-nowrap">{children}</span>;
}
function CheckIcon({ ok, warn }) {
  const bg = ok ? "bg-okt" : warn ? "bg-warnt" : "bg-badt";
  return (
    <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full shrink-0 ${bg}`}>
      {ok
        ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5"><path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/></svg>
        : <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5"><path d="M6 6l12 12M18 6L6 18" strokeLinecap="round"/></svg>}
    </span>
  );
}
function Label({ children }) { return <label className="block text-[11px] uppercase tracking-wider text-sub font-semibold mb-1">{children}</label>; }
function TextInput(props) {
  return <input {...props} className={"w-full bg-card border border-line rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:border-accent " + (props.className || "")} />;
}
function Select(props) {
  return <select {...props} className={"w-full bg-card border border-line rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:border-accent " + (props.className || "")}>{props.children}</select>;
}
function Button({ children, onClick, variant, disabled, type }) {
  const v = {
    primary: "bg-accent text-white hover:bg-blue-700",
    ghost: "bg-card border border-line text-ink hover:border-accent",
    danger: "bg-badt text-white hover:bg-red-800",
  };
  return <button type={type || "button"} onClick={onClick} disabled={disabled}
    className={`px-3.5 py-1.5 rounded-lg text-sm font-semibold transition disabled:opacity-50 ${v[variant || "primary"]}`}>{children}</button>;
}
function ErrorBanner({ msg }) {
  return msg ? <div className="mb-4 bg-badbg border border-badt/20 text-badt text-sm rounded-lg px-4 py-3">{msg}</div> : null;
}
function SummaryTile({ n, label, tone }) {
  const tones = { ok: "bg-okbg text-okt", warn: "bg-warnbg text-warnt", bad: "bg-badbg text-badt", gray: "bg-chip text-sub" };
  return (
    <div className={`rounded-lg px-4 py-3 text-center ${tones[tone]}`}>
      <div className="text-xl font-bold font-mono">{n}</div>
      <div className="text-[10px] font-bold uppercase tracking-widest">{label}</div>
    </div>
  );
}
function LayerChip({ layer, dark }) {
  return <span className={`font-mono text-[11px] font-bold px-1.5 py-0.5 rounded ${dark ? "bg-ink text-page" : "bg-accentbg text-accent"}`}>{layer}</span>;
}
function SectionHead({ title, right, chip, hint }) {
  return (
    <div className="px-5 py-3.5 border-b border-line flex items-center gap-2.5">
      {chip}
      <h3 className="font-bold" title={hint || undefined}>{title}</h3>
      {right && <span className="text-xs text-sub ml-auto">{right}</span>}
    </div>
  );
}

// ---------------------------------------------------------------- Pre-Visit
function PrevisitTab({ apiBase, onExceptionsChanged, navReq, go }) {
  const [cases, setCases] = useState([]);
  const [selected, setSelected] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const data = await api(apiBase, "/v1/oncology/previsit/cases");
      setCases(data);
      setSelected(prev => prev ? data.find(c => c.case_id === prev.case_id) || data[0] : data[0]);
      setError(null);
    } catch (e) { setError(e.message); }
  }, [apiBase]);
  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (navReq && navReq.caseId && cases.length) {
      const c = cases.find(x => x.case_id === navReq.caseId);
      if (c) setSelected(c);
    }
  }, [navReq && navReq.token, cases]);

  const passCount = c => [c.checks.eligibility === "ACTIVE",
    c.checks.cob !== "UNRESOLVED" && c.checks.cob !== "UNKNOWN",
    c.checks.network_status === "IN_NETWORK",
    !c.checks.referral_required || c.checks.referral_on_file].filter(Boolean).length;
  const ready = cases.filter(c => c.readiness_status === "READY").length;
  const action = cases.filter(c => c.readiness_status === "ACTION_NEEDED").length;
  const blocked = cases.filter(c => c.readiness_status === "BLOCKED").length;

  const apptWord = c => {
    const d = new Date(c.appointment_date + "T00:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((d - today) / 86400000);
    return diff <= 1 ? "Tomorrow" : `In ${diff} days`;
  };

  const checkRows = c => [
    { ok: c.checks.eligibility === "ACTIVE", title: "DOS eligibility",
      sub: c.checks.eligibility === "ACTIVE" ? `Active on ${c.appointment_date} · verified via 270/271 today` : `Status ${c.checks.eligibility} — verify coverage before the visit` },
    { ok: c.checks.cob !== "UNRESOLVED" && c.checks.cob !== "UNKNOWN", title: "Coordination of benefits",
      sub: c.checks.cob === "RESOLVED" ? "Primary only — no COB conflict" : `COB ${c.checks.cob}` },
    { ok: c.checks.network_status === "IN_NETWORK", title: "Network status",
      sub: c.checks.network_status === "IN_NETWORK" ? "Rendering provider in-network for this plan" : "Provider out-of-network for this plan" },
    { ok: !c.checks.referral_required || c.checks.referral_on_file, title: "Referral / auth on file",
      sub: c.checks.referral_required ? (c.checks.referral_on_file ? "Referral approved · on file" : "Required referral is missing") : "Referral not required for this plan" },
  ];

  return (
    <div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2">
          <Card className="p-4">
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="font-bold text-ink">Pre-visit readiness</h2>
              <span className="font-mono text-xs text-sub">{cases.length} scheduled</span>
            </div>
            <p className="text-xs text-sub mb-3">Checked automatically 2 days before each appointment</p>
            <div className="grid grid-cols-3 gap-2 mb-4">
              <SummaryTile n={ready} label="Go" tone="ok" />
              <SummaryTile n={action} label="Caution" tone="warn" />
              <SummaryTile n={blocked} label="Stop" tone="bad" />
            </div>
            <div className="divide-y divide-line -mx-4">
              {cases.map(c => (
                <div key={c.case_id} onClick={() => setSelected(c)}
                  className={`px-4 py-3 cursor-pointer border-l-[3px] ${selected && selected.case_id === c.case_id ? "border-l-accent bg-accentsel" : "border-l-transparent hover:bg-hoverbg"}`}>
                  <div className="flex items-center justify-between">
                    <span className="font-semibold">{c.patient_name || c.patient_ref}</span>
                    <Pill tone={readyTone(c.readiness_status)}>{readyWord(c.readiness_status)}</Pill>
                  </div>
                  <div className="text-xs text-sub mt-0.5">{passCount(c)}/4 checks pass · {c.regimen || "Scheduled visit"}</div>
                  <div className="text-xs mt-0.5">
                    <span className="text-accent font-semibold">{apptWord(c)}</span>
                    <span className="font-mono text-sub"> · {c.appt_time || ""} · {c.appointment_date}</span>
                  </div>
                </div>
              ))}
              {cases.length === 0 && <p className="px-4 py-3 text-sub text-sm">No cases scheduled.</p>}
            </div>
            <TrafficLegend />
          </Card>
        </div>

        <div className="lg:col-span-3 space-y-4">
          {selected ? (
            <React.Fragment>
              <Card className="p-5">
                <div className="flex items-center gap-3">
                  <h2 className="text-2xl font-bold">{selected.patient_name || selected.patient_ref}</h2>
                  <Pill tone={readyTone(selected.readiness_status)}>{readyWord(selected.readiness_status)}</Pill>
                </div>
                <p className="text-sm text-sub mt-1">{selected.age_sex} · {selected.cancer}</p>
                <p className="text-sm text-sub">{selected.regimen} · {selected.physician}</p>
                <div className={`mt-4 rounded-lg px-4 py-3 flex items-center gap-3 ${selected.readiness_status === "READY" ? "bg-okbg" : selected.readiness_status === "ACTION_NEEDED" ? "bg-warnbg" : "bg-badbg"}`}>
                  <CheckIcon ok={selected.readiness_status === "READY"} warn={selected.readiness_status === "ACTION_NEEDED"} />
                  <div>
                    <div className={`text-[10px] font-bold uppercase tracking-widest ${selected.readiness_status === "READY" ? "text-okt/70" : selected.readiness_status === "ACTION_NEEDED" ? "text-warnt/70" : "text-badt/70"}`}>Gate to claim precheck</div>
                    <div className={`font-semibold ${selected.readiness_status === "READY" ? "text-okt" : selected.readiness_status === "ACTION_NEEDED" ? "text-warnt" : "text-badt"}`}>
                      {selected.readiness_status === "READY" ? "GO — clears into claim precheck"
                        : selected.readiness_status === "ACTION_NEEDED" ? "CAUTION — resolve before the visit"
                        : "STOP — will deny unless resolved before the visit"}
                    </div>
                  </div>
                </div>
              </Card>
              <Card>
                <SectionHead title="Pre-visit checks" right="Last checked: 2 days before visit" />
                <div className="divide-y divide-line">
                  {checkRows(selected).map((r, i) => (
                    <div key={i} className="px-5 py-3.5 flex items-start gap-3">
                      <CheckIcon ok={r.ok} />
                      <div>
                        <div className="font-semibold text-sm">{r.title}</div>
                        <div className="text-xs text-sub mt-0.5">{r.sub}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </Card>
              {selected.exceptions_created.length > 0 && (
                <Card className="p-5">
                  <h3 className="font-bold mb-1.5">Next action</h3>
                  <p className="text-sm text-sub">{selected.next_action}</p>
                  <p className="text-xs text-sub mt-2">Linked exceptions: {selected.exceptions_created.map(id => (
                    <button key={id} onClick={() => go("exceptions", { excId: id })}
                      className="font-mono text-xs bg-accentbg text-accent px-2 py-0.5 rounded mr-1 hover:underline">{id} →</button>
                  ))}</p>
                </Card>
              )}
            </React.Fragment>
          ) : <Card className="p-5 text-sub text-sm">Select a case to see its readiness detail.</Card>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Denial Prevention
function DenialTab({ apiBase, navReq, go }) {
  const [claims, setClaims] = useState([]);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState("ALL");
  const [error, setError] = useState(null);
  const [denyCarc, setDenyCarc] = useState("197");
  const [denyRarc, setDenyRarc] = useState("");
  const [denyPaid, setDenyPaid] = useState("0");
  const [denyMsg, setDenyMsg] = useState(null);

  const load = useCallback(async () => {
    try {
      const data = await api(apiBase, "/v1/oncology/precheck/claims");
      setClaims(data);
      setSelected(prev => prev ? data.find(c => c.claim_id === prev.claim_id) || data[0] : data[0]);
      setError(null);
    } catch (e) { setError(e.message); }
  }, [apiBase]);
  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!navReq || !claims.length) return;
    if (navReq.claimId) {
      const c = claims.find(x => x.claim_id === navReq.claimId);
      if (c) setSelected(c);
    } else if (navReq.codes) {
      const codeSet = new Set(navReq.codes);
      const c = claims.find(x => x.jcodes.some(j => codeSet.has(j)) || x.cpt_codes.some(p => codeSet.has(p)));
      if (c) setSelected(c);
    }
  }, [navReq && navReq.token, claims]);

  const highCount = claims.filter(c => c.risk_level === "HIGH" || c.risk_level === "CRITICAL").length;
  const preauthCount = claims.filter(c => c.auth_required).length;
  const shown = filter === "ALL" ? claims
    : filter === "HIGH" ? claims.filter(c => c.risk_level === "HIGH" || c.risk_level === "CRITICAL")
    : claims.filter(c => c.auth_required);

  const biomarkers = c => {
    const b = [];
    if (c.cdx_status.pdl1_present) b.push({ dot: "bg-accent", text: `PD-L1 ${c.cdx_status.pdl1_score >= 50 ? "High" : c.cdx_status.pdl1_score + "%"}` });
    if (c.cdx_status.her2_present) b.push({ dot: "bg-okt", text: "HER2 positive" });
    if (c.cdx_status.egfr_present) b.push({ dot: "bg-warnt", text: "EGFR mutation" });
    if (c.cdx_status.brca_present) b.push({ dot: "bg-badt", text: "BRCA variant" });
    if (c.line) b.push({ dot: "bg-warnt", text: `Line · ${c.line}` });
    return b;
  };
  const subLine = c => {
    const cancer = (c.nccn_match.cancer_type || "").split("/")[0].trim();
    const marker = c.cdx_status.pdl1_present ? "PD-L1 High" : c.cdx_status.her2_present ? "HER2+" : c.cdx_status.egfr_present ? "EGFR+" : c.primary_dx;
    return `${cancer || c.primary_dx} · ${marker}`;
  };

  return (
    <div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2">
          <Card className="p-4">
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="font-bold">Work queue</h2>
              <span className="font-mono text-xs text-sub">{claims.length} claims</span>
            </div>
            <p className="text-xs text-sub mb-3">Pre-submission review · sorted by denial risk</p>
            <div className="flex gap-2 mb-2 flex-wrap">
              <button onClick={() => setFilter("ALL")} className={`px-3 py-1 rounded-full text-xs font-semibold ${filter === "ALL" ? "bg-accent text-white" : "bg-chip text-sub"}`}>All claims · {claims.length}</button>
              <button onClick={() => setFilter("HIGH")} className={`px-3 py-1 rounded-full text-xs font-semibold ${filter === "HIGH" ? "bg-accent text-white" : "bg-chip text-sub"}`}>High risk · {highCount}</button>
              <button onClick={() => setFilter("AUTH")} className={`px-3 py-1 rounded-full text-xs font-semibold ${filter === "AUTH" ? "bg-accent text-white" : "bg-chip text-sub"}`}>Pre-auth · {preauthCount}</button>
            </div>
            <div className="divide-y divide-line -mx-4">
              {shown.map(c => (
                <div key={c.claim_id} onClick={() => setSelected(c)}
                  className={`px-4 py-3 cursor-pointer border-l-[3px] ${selected && selected.claim_id === c.claim_id ? "border-l-accent bg-accentsel" : "border-l-transparent hover:bg-hoverbg"}`}>
                  <div className="flex items-center justify-between">
                    <span className="font-semibold">{c.patient_name || c.claim_id}</span>
                    <span className="flex items-center gap-1.5">
                      {c.denied && <Pill tone="bad">Denied</Pill>}
                      <Pill tone={riskTone(c.risk_level)}>{riskWord(c.risk_level)}</Pill>
                    </span>
                  </div>
                  <div className="text-xs text-sub mt-0.5">{subLine(c)}</div>
                  <div className="flex items-center justify-between mt-0.5">
                    <span className="text-xs text-sub">{c.payer_name}</span>
                    <span className="font-mono text-sm font-semibold">{money(c.billed_amount)}</span>
                  </div>
                </div>
              ))}
              {shown.length === 0 && <p className="px-4 py-3 text-sub text-sm">No claims match this filter.</p>}
            </div>
          </Card>
        </div>

        <div className="lg:col-span-3 space-y-4">
          {selected ? (
            <React.Fragment>
              <Card className="p-5">
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-3">
                      <h2 className="text-2xl font-bold">{selected.patient_name || selected.claim_id}</h2>
                      <MonoChip>MRN {selected.mrn || selected.claim_id}</MonoChip>
                    </div>
                    <p className="text-sm text-sub mt-1">{selected.age_sex} · {(selected.nccn_match.cancer_type || "").split("/")[0].trim()} · Service date {selected.dos}</p>
                    {selected.denied && (
                      <div className="mt-2 bg-badbg rounded-lg px-3 py-2 text-xs">
                        <div className="font-bold text-badt">DENIED {selected.denied_date} · CARC {selected.denial_carc}{selected.denial_rarc ? ` / RARC ${selected.denial_rarc}` : ""}</div>
                        <div className="text-badt/90 mt-0.5">{selected.denial_reason}</div>
                        <div className="text-badt/80 mt-1 font-mono">
                          Billed {money(selected.billed_amount)} · Paid {money(selected.paid_amount || 0)} · At risk {money((selected.billed_amount || 0) - (selected.paid_amount || 0))}
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="text-right">
                    <div className="text-2xl font-bold font-mono">{money(selected.billed_amount)}</div>
                    <div className="text-sm text-sub">{selected.payer_name}</div>
                    <div className="text-xs text-sub">{selected.plan_name || selected.plan_type.replaceAll("_", " ")}</div>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-line">
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Diagnosis</div>
                    <div className="font-semibold text-sm mt-0.5">{(selected.nccn_match.cancer_type || "—").split("/")[0].trim()} carcinoma</div>
                    <div className="font-mono text-xs text-sub">{selected.primary_dx}</div>
                  </div>
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Stage</div>
                    <div className="font-semibold text-sm mt-0.5">{selected.stage || "—"}</div>
                    <div className="text-xs text-sub">{selected.line || ""}</div>
                  </div>
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Planned regimen</div>
                    <div className="font-semibold text-sm mt-0.5">{(selected.nccn_match.regimen || "—").split(" ")[0]}</div>
                    <div className="font-mono text-xs text-sub">
                      {selected.jcodes.map(j => (
                        <button key={j} onClick={() => go("coverage", { code: j })} className="text-accent hover:underline mr-1" title="View coverage policy">{j}</button>
                      ))}
                      · {selected.line || ""}
                    </div>
                  </div>
                </div>
                {biomarkers(selected).length > 0 && (
                  <div className="flex items-center gap-2 mt-4 pt-3 border-t border-line flex-wrap">
                    <span className="text-[10px] font-bold uppercase tracking-widest text-sub">Biomarkers</span>
                    {biomarkers(selected).map((b, i) => (
                      <span key={i} className="inline-flex items-center gap-1.5 bg-chip rounded-full px-2.5 py-1 text-xs font-semibold">
                        <span className={`w-2 h-2 rounded-full ${b.dot}`}></span>{b.text}
                      </span>
                    ))}
                  </div>
                )}
              </Card>

              <Card>
                <SectionHead chip={<LayerChip layer="L1" dark />} title="Rule check (pass/fail)" right="Rules engine · pass/fail, not a prediction" />
                <div className="p-5">
                  {selected.rule_blockers.length > 0 ? (
                    <React.Fragment>
                      <div className="bg-badbg rounded-lg px-4 py-3 flex items-start gap-3 mb-3">
                        <CheckIcon ok={false} />
                        <div>
                          <div className="font-bold text-badt">{selected.rule_blockers.length} rule check{selected.rule_blockers.length > 1 ? "s" : ""} failed — hard block</div>
                          <div className="text-sm text-badt/80 mt-0.5">These are policy/coding rule failures, not predictions. Claim will deny until each is cleared.</div>
                        </div>
                      </div>
                      <div className="space-y-2">
                        {selected.rule_blockers.map(b => (
                          <div key={b.exception_id} className="border border-line border-l-[3px] border-l-badt rounded-lg px-4 py-3 flex items-center gap-3">
                            <span className="font-mono text-[10px] font-bold text-badt bg-badbg px-1.5 py-0.5 rounded shrink-0">RULE FAILED</span>
                            <div className="text-sm flex-1">{b.message}</div>
                            <button onClick={() => go("exceptions", { excId: b.exception_id })}
                              className="font-mono text-xs bg-accentbg text-accent px-2 py-0.5 rounded hover:underline shrink-0">{b.exception_id} →</button>
                          </div>
                        ))}
                      </div>
                    </React.Fragment>
                  ) : (
                    <div className="bg-okbg rounded-lg px-4 py-3 flex items-center gap-3">
                      <CheckIcon ok={true} />
                      <div className="font-semibold text-okt">All rule checks pass — no hard blocks</div>
                    </div>
                  )}
                </div>
              </Card>

              <Card>
                <SectionHead chip={<LayerChip layer="L2" />} title="Risk estimate (advisory)" right="Heuristic stand-in · advisory, not a determination"
                  hint={`Scoring version: ${selected.model_version}`} />
                <div className="p-5">
                  <div className="flex items-center gap-3 mb-4">
                    <Pill tone={riskTone(selected.risk_level)}>{selected.risk_level}</Pill>
                    <span className="font-mono font-bold text-lg">{(selected.risk_score * 100).toFixed(0)}%</span>
                    <span className="text-sm text-sub">estimated denial risk · predicted class <span className="font-mono">{selected.predicted_denial_class}</span></span>
                  </div>
                  <div className="grid grid-cols-4 gap-2 mb-4">
                    {Object.entries(selected.denial_probability).map(([k, v]) => (
                      <div key={k} className="bg-page rounded-lg p-2.5 text-center">
                        <div className="text-[10px] font-bold uppercase tracking-widest text-sub">{k}</div>
                        <div className="font-mono font-bold mt-0.5">{(v * 100).toFixed(0)}%</div>
                      </div>
                    ))}
                  </div>
                  <div className="space-y-1.5">
                    {selected.shap_reasons.map((r, i) => (
                      <div key={i} className="flex items-center justify-between text-sm gap-4">
                        <span className="text-sub">{r.message}</span>
                        <span className={`font-mono font-semibold shrink-0 ${String(r.impact).startsWith("+") ? "text-badt" : "text-okt"}`}>{r.impact}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </Card>

              <Card className="p-5">
                <h3 className="font-bold mb-2">Recommended actions</h3>
                <ul className="space-y-1.5">
                  {selected.recommended_actions.map((a, i) => (
                    <li key={i} className="text-sm text-sub flex gap-2"><span className="text-accent font-bold">→</span>{a}</li>
                  ))}
                </ul>
              </Card>

              <Card className="p-5">
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <h3 className="font-bold">Payer denial received?</h3>
                    <p className="text-xs text-sub mt-0.5">
                      {selected.denied
                        ? <span>Denial recorded (<span className="font-mono">CARC {selected.denial_carc}</span> on <span className="font-mono">{selected.denied_date}</span>) — the appeal package is in the Appeals tab.</span>
                        : "Record the denial to auto-draft an appeal citing this claim's attached evidence (M-06 workflow)."}
                    </p>
                  </div>
                  {!selected.denied && (
                    <div className="flex items-end gap-2 flex-wrap">
                      <div>
                        <Label>Denial code</Label>
                        <Select value={denyCarc} onChange={e => setDenyCarc(e.target.value)} className="w-56">
                          {[["197", "Authorization absent"], ["15", "Benefits not assigned"], ["16", "Claim lacks information"],
                            ["50", "Not covered under plan"], ["96", "Not medically necessary"], ["151", "Units not supported"],
                            ["167", "Non-covered illness"], ["4", "Modifier inconsistent"], ["18", "Duplicate claim"],
                            ["119", "Benefit maximum exceeded"], ["125", "Submission/billing error"]].map(([c, d]) =>
                              <option key={c} value={c}>CARC {c} — {d}</option>)}
                        </Select>
                      </div>
                      <div>
                        <Label>RARC (optional)</Label>
                        <TextInput value={denyRarc} onChange={e => setDenyRarc(e.target.value)} placeholder="e.g. N702" className="w-28 font-mono" />
                      </div>
                      <div>
                        <Label>Paid amount</Label>
                        <TextInput type="number" value={denyPaid} onChange={e => setDenyPaid(e.target.value)} className="w-28 font-mono" />
                      </div>
                      <Button variant="danger" onClick={async () => {
                        try {
                          await api(apiBase, `/v1/oncology/claims/${selected.claim_id}/deny`, {
                            method: "POST",
                            body: JSON.stringify({ carc: denyCarc, rarc: denyRarc || null, paid_amount: Number(denyPaid) || 0 }),
                          });
                          setDenyMsg(`Denial recorded — appeal drafted in the Appeals tab.`);
                          await load();
                        } catch (e) { setError(e.message); }
                      }}>Record denial</Button>
                    </div>
                  )}
                </div>
                {denyMsg && !selected.denied && <p className="text-xs text-okt mt-2">{denyMsg}</p>}
              </Card>
            </React.Fragment>
          ) : <Card className="p-5 text-sub text-sm">Select a claim to see its precheck detail.</Card>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Eligibility
function EligibilityTab({ apiBase, go }) {
  const [panel, setPanel] = useState(null);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [selCase, setSelCase] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    api(apiBase, "/v1/oncology/eligibility/summary").then(setPanel).catch(e => setError(e.message));
  }, [apiBase]);

  if (error) return <ErrorBanner msg={error} />;
  if (!panel) return <Card className="p-5 text-sub text-sm">Loading eligibility results…</Card>;

  const rows = panel.patients.filter(r => {
    if (statusFilter && r.status !== statusFilter) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return r.patient.toLowerCase().includes(q) || r.payer.toLowerCase().includes(q) || r.cancer.toLowerCase().includes(q);
  });
  const selPatient = panel.patients.find(p => p.case_id === selCase) || rows[0] || null;
  const cardTone = { ok: "text-okt", warn: "text-warnt", bad: "text-badt" };
  const dotTone = { ok: "bg-okt", warn: "bg-warnt", bad: "bg-badt" };
  const statusPill = s => s === "Active" ? "ok" : s === "Needs review" ? "warn" : "bad";

  function exportCsv() {
    const head = "Patient,Age,Cancer,Payer,Network,Status,Effective,Termed,Benefit,Notes";
    const body = panel.patients.map(r => [r.patient, r.age, r.cancer, `${r.payer} (${r.payer_kind})`, r.network, r.status, r.effective || "", r.termed || "", r.benefit, `"${r.notes}"`].join(","));
    const blob = new Blob([[head, ...body].join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "eligibility_results.csv";
    a.click();
  }

  function BenefitBar({ label, used, total }) {
    const pct = total ? Math.min(100, Math.round(used / total * 100)) : 0;
    return (
      <div>
        <div className="flex items-center justify-between text-xs mb-1">
          <span className="text-sub">{label}</span>
          <span className="font-mono">{money(used)} <span className="text-sub">of {money(total)}</span></span>
        </div>
        <div className="h-2 rounded-full bg-chip overflow-hidden">
          <div className={`h-full rounded-full ${pct >= 100 ? "bg-okt" : "bg-accent"}`} style={{ width: pct + "%" }}></div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-start justify-between mb-4">
        <div>
          <div className="flex items-center gap-2 text-okt text-[11px] font-bold uppercase tracking-widest mb-1">
            <CheckIcon ok={true} /> Verification complete
          </div>
          <h2 className="text-2xl font-bold">Eligibility results</h2>
          <p className="text-sm text-sub mt-1">{panel.headline}</p>
        </div>
        <div className="flex gap-2">
          <Button variant="ghost" onClick={() => { setQuery(""); setStatusFilter(""); }}>↻ Re-run</Button>
          <Button onClick={exportCsv}>↓ Export All (CSV)</Button>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        {panel.cards.map(c => (
          <Card key={c.label} className={`p-4 cursor-pointer ${statusFilter === c.label ? "border-accent" : ""}`}
            >
            <div onClick={() => ["Active", "Needs review", "Inactive"].includes(c.label) && setStatusFilter(statusFilter === c.label ? "" : c.label)}>
              <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-sub">
                <span className={`w-2 h-2 rounded-full ${dotTone[c.tone]}`}></span>{c.label}
              </div>
              <div className={`text-3xl font-bold font-mono mt-1 ${cardTone[c.tone]}`}>{c.value}</div>
              <div className="text-xs text-sub mt-1">{c.sub}</div>
              <div className="text-[11px] text-sub mt-0.5">{c.pct}{["Active", "Needs review", "Inactive"].includes(c.label) ? " · tap to filter" : ""}</div>
            </div>
          </Card>
        ))}
        <Card className="p-4">
          <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Billable readiness</div>
          <div className="text-3xl font-bold font-mono mt-1 text-accent">{panel.readiness_pct}% <span className="text-xs text-sub font-sans font-normal">ready now</span></div>
          <div className="h-2 rounded-full overflow-hidden flex mt-2 bg-chip">
            <div className="bg-okt" style={{ width: panel.readiness_pct + "%" }}></div>
            <div className="bg-badt" style={{ width: (100 - panel.readiness_pct) + "%" }}></div>
          </div>
          <div className="text-[11px] text-sub mt-1.5">{panel.need_action} patients need action before billing</div>
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <Card className="lg:col-span-3">
          <div className="px-5 py-3 border-b border-line flex items-center gap-3">
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search patient, payer, or cancer type…"
              className="flex-1 bg-page border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent" />
            <span className="text-xs text-sub whitespace-nowrap">{rows.length} of {panel.patients.length} patients{statusFilter ? ` · ${statusFilter}` : ""}</span>
          </div>
          <div className="overflow-x-auto max-h-[520px] overflow-y-auto">
            <table className="w-full text-sm">
              <thead className="sticky top-0 bg-card">
                <tr className="text-left text-[11px] uppercase tracking-wider text-sub border-b border-line">
                  <th className="px-5 py-2.5">Patient</th><th className="pr-3">Age</th>
                  <th className="pr-3">Cancer</th><th className="pr-3">Payer</th><th className="pr-3">Network</th>
                  <th className="pr-3">Status</th><th className="pr-3">Effective</th><th className="pr-3">Termed</th>
                  <th className="pr-3">Benefit</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.case_id} onClick={() => setSelCase(r.case_id)}
                    className={`border-b border-line cursor-pointer ${selPatient && selPatient.case_id === r.case_id ? "bg-accentsel" : "hover:bg-hoverbg"}`}>
                    <td className="px-5 py-2.5 font-semibold">{r.patient}</td>
                    <td className="pr-3 text-sub">{r.age}</td>
                    <td className="pr-3">{r.cancer}</td>
                    <td className="pr-3">{r.payer}<div className="text-[11px] text-sub">{r.payer_kind}</div></td>
                    <td className={`pr-3 ${r.network === "OON" ? "text-badt font-semibold" : "text-sub"}`}>{r.network}</td>
                    <td className="pr-3"><span className="inline-flex items-center gap-1.5 whitespace-nowrap"><span className={`w-2 h-2 rounded-full ${dotTone[statusPill(r.status)]}`}></span>{r.status}</span></td>
                    <td className="pr-3 font-mono text-xs text-sub whitespace-nowrap">{r.effective || "—"}</td>
                    <td className={`pr-3 font-mono text-xs whitespace-nowrap ${r.termed ? "text-badt font-semibold" : "text-sub"}`}>{r.termed || "—"}</td>
                    <td className="pr-3"><Pill tone={r.benefit === "Covered" ? "ok" : "gray"}>{r.benefit}</Pill></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>

        <div className="lg:col-span-2">
          {selPatient ? (
            <Card className="p-5">
              <div className="flex items-center gap-2.5 mb-1">
                <h3 className="font-bold text-lg">{selPatient.patient}</h3>
                <Pill tone={statusPill(selPatient.status)}>{selPatient.status}</Pill>
                <button onClick={() => go("previsit", { caseId: selPatient.case_id })}
                  className="text-xs font-semibold text-accent hover:underline ml-auto">Pre-visit case →</button>
              </div>
              <p className="text-sm text-sub mb-1">{selPatient.age} · {selPatient.cancer} · {selPatient.payer} ({selPatient.payer_kind})</p>
              <p className="text-xs text-sub mb-1">
                Coverage effective <span className="font-mono">{selPatient.effective || "unknown"}</span>
                {selPatient.termed
                  ? <span> · <span className="text-badt font-semibold">termed <span className="font-mono">{selPatient.termed}</span></span></span>
                  : <span> · no term date on file</span>}
              </p>
              <p className="text-xs text-sub mb-4">{selPatient.notes}</p>
              {selPatient.benefits ? (
                <div>
                  <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-3">Benefit accumulators <span className="normal-case font-normal">· from 271 response</span></h4>
                  <div className="space-y-3">
                    <BenefitBar label="Deductible" used={selPatient.benefits.deductible_used} total={selPatient.benefits.deductible_total} />
                    <BenefitBar label="Out-of-pocket max" used={selPatient.benefits.oop_used} total={selPatient.benefits.oop_max} />
                  </div>
                  <div className="border-t border-line mt-4 pt-3">
                    <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">Member responsibility</h4>
                    <div className="grid grid-cols-2 gap-3 text-sm">
                      <div className="bg-page rounded-lg px-3 py-2">
                        <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Specialist copay</div>
                        <div className="font-mono font-bold mt-0.5">{money(selPatient.benefits.specialist_copay)}</div>
                      </div>
                      <div className="bg-page rounded-lg px-3 py-2">
                        <div className="text-[10px] font-bold uppercase tracking-widest text-sub">Coinsurance</div>
                        <div className="font-mono font-bold mt-0.5">{selPatient.benefits.coinsurance_pct}%</div>
                      </div>
                    </div>
                    {selPatient.benefits.member_est != null && (
                      <div className="flex items-center justify-between mt-3 text-sm">
                        <span className="text-sub">Estimated member responsibility (next visit)</span>
                        <span className="font-mono font-bold">{money(selPatient.benefits.member_est)}</span>
                      </div>
                    )}
                  </div>
                </div>
              ) : (
                <div className="bg-warnbg text-warnt rounded-lg px-4 py-3 text-sm">
                  Benefit details unavailable — coverage could not be verified for this patient. Resolve the eligibility exception before estimating member responsibility.
                </div>
              )}
            </Card>
          ) : <Card className="p-5 text-sub text-sm">Select a patient to view benefit details.</Card>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Coverage Rules
function CoverageTab({ apiBase, navReq, go }) {
  const [policies, setPolicies] = useState([]);
  const [selected, setSelected] = useState(null);
  const [query, setQuery] = useState("");
  const [error, setError] = useState(null);

  useEffect(() => {
    api(apiBase, "/v1/oncology/coverage/policies").then(d => { setPolicies(d); setSelected(d[0]); }).catch(e => setError(e.message));
  }, [apiBase]);

  useEffect(() => {
    if (navReq && navReq.code && policies.length) {
      const p = policies.find(x => x.covered_codes.some(c => c[0] === navReq.code));
      if (p) setSelected(p);
    }
  }, [navReq && navReq.token, policies]);

  const shown = policies.filter(p => {
    if (!query) return true;
    const q = query.toLowerCase();
    return p.policy_id.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) || p.source.toLowerCase().includes(q)
      || p.covered_codes.some(c => c[0].toLowerCase().includes(q));
  });

  return (
    <div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2">
          <Card className="p-4">
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="font-bold">Coverage rule library</h2>
              <span className="font-mono text-xs text-sub">{policies.length} policies</span>
            </div>
            <p className="text-xs text-sub mb-3">LCD / NCD / payer policies cited by precheck</p>
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Filter by code, drug, or payer…"
              className="w-full bg-page border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent mb-3" />
            <div className="divide-y divide-line -mx-4">
              {shown.map(p => (
                <div key={p.policy_id} onClick={() => setSelected(p)}
                  className={`px-4 py-3 cursor-pointer border-l-[3px] ${selected && selected.policy_id === p.policy_id ? "border-l-accent bg-accentsel" : "border-l-transparent hover:bg-hoverbg"}`}>
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-sm font-semibold">{p.policy_id}</span>
                    <Pill tone={p.kind === "LCD" ? "blue" : p.kind === "NCD" ? "gray" : "warn"}>{p.kind}</Pill>
                  </div>
                  <div className="text-sm mt-0.5">{p.title}</div>
                  <div className="flex items-center justify-between mt-0.5">
                    <span className="text-xs text-sub">{p.source.split("·")[0].trim()}</span>
                    <span className="text-xs text-accent font-semibold">{p.active_claims} active</span>
                  </div>
                </div>
              ))}
              {shown.length === 0 && <p className="px-4 py-3 text-sub text-sm">No policies match this filter.</p>}
            </div>
          </Card>
        </div>

        <div className="lg:col-span-3 space-y-4">
          {selected ? (
            <React.Fragment>
              <Card className="p-5">
                <div className="flex items-center gap-2 mb-2">
                  <span className="font-mono text-sm font-bold text-accent bg-accentbg px-2 py-0.5 rounded">{selected.policy_id}</span>
                  <Pill tone="blue">{selected.kind}</Pill>
                  <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-okt"><span className="w-2 h-2 rounded-full bg-okt"></span>{selected.status}</span>
                </div>
                <h2 className="text-2xl font-bold">{selected.title}</h2>
                <p className="text-sm text-sub mt-1">{selected.source} · Updated {selected.updated}</p>
                <div className="bg-page rounded-lg px-4 py-3 mt-4 text-sm text-sub leading-relaxed">{selected.summary}</div>
              </Card>
              <Card>
                <SectionHead title="Medical necessity criteria" />
                <div className="divide-y divide-line">

  if (error) return <ErrorBanner msg={error} />;
  if (!data) return <Card className="p-5 text-sub text-sm">Loading analytics…</Card>;

  const maxTrend = Math.max(1, ...data.exception_trends.map(t => t.total));
  const riskOrder = ["LOW", "MEDIUM", "HIGH", "CRITICAL"];
  const riskTotal = riskOrder.reduce((s, k) => s + (data.risk_distribution[k] || 0), 0) || 1;
  const riskColor = { LOW: "bg-okt", MEDIUM: "bg-warnt", HIGH: "bg-badt", CRITICAL: "bg-badt" };

  return (
    <div>
      <div className="flex items-start justify-between mb-4">
        <div>
          <h2 className="text-2xl font-bold">Denial prevention analytics</h2>

        </div>
        <span className="inline-flex items-center gap-1.5 bg-okbg text-okt text-xs font-bold px-3 py-1.5 rounded-full">
          <span className="w-2 h-2 rounded-full bg-okt"></span>LIVE
        </span>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        {data.kpis.map(k => (
          <Card key={k.label} className="p-4">
            <div className="text-xs text-sub">{k.label}</div>
            <div className="text-3xl font-bold font-mono mt-1">{k.value}</div>
            <div className="text-xs text-sub mt-1.5">{k.note}</div>
          </Card>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold">Exceptions by category</h3>
            <MonoChip>live counts</MonoChip>
          </div>
          <div className="space-y-4">
            {data.exception_trends.map(t => (
              <div key={t.label}>
                <div className="flex items-center justify-between text-sm mb-1.5">
                  <span className="font-semibold">{t.label}</span>
                  <span><span className="font-bold">{t.total}</span> <span className="text-sub">· {t.open} open</span></span>
                </div>
                <div className="h-2 rounded-full bg-chip overflow-hidden flex">
                  <div className="h-full bg-badt" style={{ width: (t.open / maxTrend * 100) + "%" }}></div>
                  <div className="h-full bg-accent" style={{ width: ((t.total - t.open) / maxTrend * 100) + "%" }}></div>
                </div>
              </div>
            ))}
            {data.exception_trends.length === 0 && <p className="text-sub text-sm">No exceptions recorded yet.</p>}
          </div>
          <div className="flex items-center gap-4 mt-4 pt-3 border-t border-line text-xs text-sub">
            <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-badt"></span>Open</span>
            <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-accent"></span>Resolved / in progress</span>
          </div>
        </Card>

        <div className="space-y-4">
          <Card className="p-5">
            <h3 className="font-bold mb-3">Claim risk distribution</h3>
            <div className="h-3 rounded-full bg-chip overflow-hidden flex mb-2">
              {riskOrder.map(k => (
                <div key={k} className={riskColor[k]} style={{ width: ((data.risk_distribution[k] || 0) / riskTotal * 100) + "%" }}></div>
              ))}
            </div>
            <div className="flex items-center gap-4 text-xs text-sub flex-wrap">
              {riskOrder.map(k => (
                <span key={k} className="inline-flex items-center gap-1.5">
                  <span className={`w-2.5 h-2.5 rounded-sm ${riskColor[k]}`}></span>{k} · {data.risk_distribution[k] || 0}
                </span>
              ))}

          <Card>
            <div className="px-5 py-3.5 border-b border-line"><h3 className="font-bold">Payer insights</h3></div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-[11px] uppercase tracking-wider text-sub border-b border-line">
                    <th className="px-5 py-2.5">Payer</th><th className="pr-3">Claims</th><th className="pr-3">Blockers</th>
                    <th className="pr-3">Denied</th><th className="pr-3">Avg risk</th><th className="pr-3">Billed</th>
                  </tr>
                </thead>
                <tbody>
                  {data.payer_insights.map(p => (
                    <tr key={p.payer} className="border-b border-line">
                      <td className="px-5 py-2.5 font-semibold">{p.payer}</td>
                      <td className="pr-3 font-mono">{p.claims}</td>
                      <td className={`pr-3 font-mono ${p.blockers > 0 ? "text-badt font-bold" : ""}`}>{p.blockers}</td>
                      <td className="pr-3 font-mono">{p.denied}</td>
                      <td className="pr-3 font-mono">{(p.avg_risk * 100).toFixed(0)}%</td>
                      <td className="pr-3 font-mono">{money(p.billed)}</td>

                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      </div>
      <p className="text-xs text-sub mt-4">{data.caption}</p>
    </div>
  );
}

function AppealsTab({ apiBase, go }) {
  const [queue, setQueue] = useState(null);

    api(apiBase, "/v1/oncology/appeals/queue").then(d => { setQueue(d); setSelected(d.appeals[0] || null); }).catch(e => setError(e.message));

  if (error) return <ErrorBanner msg={error} />;

// ---------------------------------------------------------------- Exceptions
const CATEGORY_ORDER = ["ELIGIBILITY", "AUTH", "REFERRAL", "COB", "CPT", "DX", "MODIFIER", "CODING", "UNITS", "CDX"];
const CATEGORY_LABELS = {
  ELIGIBILITY: "Eligibility", AUTH: "Prior Authorization", REFERRAL: "Referral",
  COB: "Coordination of Benefits", CPT: "CPT", DX: "DX", MODIFIER: "Modifier",
  CODING: "Coding", UNITS: "Units", CDX: "Diagnostics / CDx",
};

function ExceptionsTab({ apiBase, refreshKey, navReq, go }) {
  const [items, setItems] = useState([]);
  const [statusFilter, setStatusFilter] = useState("");
  const [ownerFilter, setOwnerFilter] = useState("");
  const [catFilter, setCatFilter] = useState("");
  const [audit, setAudit] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [error, setError] = useState(null);
  const [edit, setEdit] = useState({ owner: "", due_date: "", status: "", resolution_notes: "" });
  const [evForm, setEvForm] = useState({ payer_source: "", verification_method: "PORTAL", reference_number: "", verified_by: "" });

  const load = useCallback(async () => {
    try {
      const params = new URLSearchParams();
      if (statusFilter) params.set("status", statusFilter);
      if (ownerFilter) params.set("owner", ownerFilter);
      const data = await api(apiBase, "/v1/oncology/exceptions" + (params.toString() ? "?" + params.toString() : ""));
      setItems(data);
      setError(null);
    } catch (e) { setError(e.message); }
  }, [apiBase, statusFilter, ownerFilter]);
  useEffect(() => { load(); }, [load, refreshKey]);

  const selected = items.find(i => i.exception_id === selectedId);
  function openDetail(item) {
    setSelectedId(item.exception_id);
    setEdit({ owner: item.owner, due_date: item.due_date || "", status: item.status, resolution_notes: item.resolution_notes || "" });
  }

  useEffect(() => {
    if (navReq && navReq.excId && items.length) {
      const item = items.find(i => i.exception_id === navReq.excId);
      if (item) { setCatFilter(""); openDetail(item); }
    }
  }, [navReq && navReq.token, items]);

  useEffect(() => {
    api(apiBase, "/v1/oncology/audit?limit=12").then(setAudit).catch(() => {});
  }, [apiBase, refreshKey, items]);

  function openOrigin(caseId, e) {
    e.stopPropagation();
    if (caseId.startsWith("CLM")) go("denial", { claimId: caseId });
    else go("previsit", { caseId });
  }
  async function saveEdit() {
    try {
      const payload = { resolution_notes: edit.resolution_notes };
      if (edit.owner) payload.owner = edit.owner;
      if (edit.due_date) payload.due_date = edit.due_date;
      if (edit.status) payload.status = edit.status;
      const updated = await api(apiBase, `/v1/oncology/exceptions/${selectedId}`, { method: "PATCH", body: JSON.stringify(payload) });
      setItems(items.map(i => i.exception_id === updated.exception_id ? updated : i));
    } catch (e) { setError(e.message); }
  }
  async function submitEvidence(e) {
    e.preventDefault();
    try {
      await api(apiBase, `/v1/oncology/exceptions/${selectedId}/evidence`, { method: "POST", body: JSON.stringify(evForm) });
      await load();
      setEvForm({ payer_source: "", verification_method: "PORTAL", reference_number: "", verified_by: "" });
    } catch (e) { setError(e.message); }
  }

  const open = items.filter(i => i.status === "OPEN").length;
  const prog = items.filter(i => i.status === "IN_PROGRESS").length;
  const done = items.filter(i => i.status === "RESOLVED" || i.status === "WAIVED").length;

  const catCounts = {};
  items.forEach(i => { catCounts[i.category] = (catCounts[i.category] || 0) + 1; });
  const presentCats = CATEGORY_ORDER.filter(c => catCounts[c]);
  const visible = catFilter ? items.filter(i => i.category === catFilter) : items;
  const grouped = presentCats
    .filter(c => !catFilter || c === catFilter)
    .map(c => ({ cat: c, list: visible.filter(i => i.category === c) }))
    .filter(g => g.list.length > 0);

  return (
    <div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-3">
          <Card className="p-4">
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="font-bold">Exception queue</h2>
              <span className="font-mono text-xs text-sub">{items.length} exceptions</span>
            </div>
            <p className="text-xs text-sub mb-3">Every flagged issue with an owner, deadline, and evidence trail</p>
            <div className="grid grid-cols-4 gap-2 mb-4">
              <SummaryTile n={open} label="Open" tone="bad" />
              <SummaryTile n={items.filter(i => i.escalated).length} label="Escalated" tone="bad" />
              <SummaryTile n={prog} label="In progress" tone="warn" />
              <SummaryTile n={done} label="Resolved" tone="ok" />
            </div>
            <div className="flex gap-2 mb-3">
              <div className="w-44">
                <Select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                  <option value="">All statuses</option><option value="OPEN">OPEN</option><option value="IN_PROGRESS">IN_PROGRESS</option>
                  <option value="RESOLVED">RESOLVED</option><option value="WAIVED">WAIVED</option>
                </Select>
              </div>
              <div className="w-44"><TextInput placeholder="Filter by owner" value={ownerFilter} onChange={e => setOwnerFilter(e.target.value)} /></div>
              <Button variant="ghost" onClick={load}>Refresh</Button>
            </div>
            <div className="flex gap-1.5 mb-3 flex-wrap">
              <button onClick={() => setCatFilter("")}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold ${!catFilter ? "bg-accent text-white" : "bg-chip text-sub"}`}>
                All · {items.length}
              </button>
              {presentCats.map(c => (
                <button key={c} onClick={() => setCatFilter(catFilter === c ? "" : c)}
                  className={`px-2.5 py-1 rounded-full text-xs font-semibold ${catFilter === c ? "bg-accent text-white" : "bg-chip text-sub"}`}>
                  {CATEGORY_LABELS[c]} · {catCounts[c]}
                </button>
              ))}
            </div>
            <div className="-mx-4">
              {grouped.map(g => (
                <div key={g.cat}>
                  <div className="px-4 py-2 bg-page border-y border-line flex items-center justify-between sticky top-0">
                    <span className="text-[11px] font-bold uppercase tracking-widest text-sub">{CATEGORY_LABELS[g.cat]}</span>
                    <span className="font-mono text-xs text-sub">{g.list.length}</span>
                  </div>
                  <div className="divide-y divide-line">
                    {g.list.map(i => (
                      <div key={i.exception_id} onClick={() => openDetail(i)}
                        className={`px-4 py-3 cursor-pointer border-l-[3px] ${selectedId === i.exception_id ? "border-l-accent bg-accentsel" : "border-l-transparent hover:bg-hoverbg"}`}>
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-xs font-semibold">{i.exception_id}</span>
                            <LayerChip layer={i.source_layer} />
                            {i.blocks_service && <Pill tone="bad">Must fix before visit</Pill>}
                            {i.escalated && <Pill tone="bad">Unassigned 24h+</Pill>}
                          </div>
                          <Pill tone={statusTone(i.status)}>{i.status.replaceAll("_", " ")}</Pill>
                        </div>
                        <div className="text-sm mt-1">{i.description}</div>
                        <div className="text-xs text-sub mt-0.5">
                          <button onClick={e => openOrigin(i.case_id, e)} className="font-mono text-accent hover:underline">{i.case_id} →</button>
                          {" "}· Owner {i.owner} · Due <span className="font-mono">{i.due_date || "—"}</span>
                          {i.evidence.length > 0 && <span> · {i.evidence.length} evidence</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
              {grouped.length === 0 && <p className="px-4 py-3 text-sub text-sm">No exceptions match this filter.</p>}
            </div>
          </Card>
        </div>

        <div className="lg:col-span-2">
          {selected ? (
            <Card className="p-5">
              <div className="flex items-center gap-2 mb-1">
                <h3 className="font-bold font-mono">{selected.exception_id}</h3>
                <Pill tone={statusTone(selected.status)}>{selected.status.replaceAll("_", " ")}</Pill>
              </div>
              <p className="text-xs text-sub mb-2"><LayerChip layer={selected.source_layer} /> · {selected.category} · blocks service: {selected.blocks_service ? "yes" : "no"}</p>
              <p className="text-sm mb-4">{selected.description}</p>
              <div className="space-y-2.5 mb-4">
                <div><Label>Owner</Label><TextInput value={edit.owner} onChange={e => setEdit({ ...edit, owner: e.target.value })} /></div>
                <div><Label>Due date</Label><TextInput type="date" value={edit.due_date} onChange={e => setEdit({ ...edit, due_date: e.target.value })} /></div>
                <div><Label>Status</Label>
                  <Select value={edit.status} onChange={e => setEdit({ ...edit, status: e.target.value })}>
                    <option value="OPEN">OPEN</option><option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="RESOLVED">RESOLVED</option><option value="WAIVED">WAIVED</option>
                  </Select></div>
                <div><Label>Resolution notes</Label>
                  <textarea rows="2" className="w-full bg-card border border-line rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:border-accent"
                    value={edit.resolution_notes} onChange={e => setEdit({ ...edit, resolution_notes: e.target.value })} /></div>
                <Button onClick={saveEdit}>Save changes</Button>
              </div>
              <div className="border-t border-line pt-4">
                <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">Payer evidence</h4>
                {selected.evidence.length === 0 && <p className="text-xs text-sub mb-2">No evidence attached yet.</p>}
                <div className="space-y-1.5 mb-3">
                  {selected.evidence.map(ev => (
                    <div key={ev.evidence_id} className="bg-page rounded-lg px-3 py-2 text-xs">
                      <div className="font-semibold">{ev.payer_source} <span className="text-sub font-normal">· {ev.verification_method}</span></div>
                      <div className="text-sub font-mono mt-0.5">ref {ev.reference_number || "—"} · {String(ev.verified_at).slice(0, 16).replace("T", " ")} · {ev.verified_by}</div>
                    </div>
                  ))}
