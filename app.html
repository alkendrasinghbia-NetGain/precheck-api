                <form onSubmit={submitEvidence} className="space-y-2">
                  <TextInput required placeholder="Payer source (portal, phone, EDI txn)" value={evForm.payer_source} onChange={e => setEvForm({ ...evForm, payer_source: e.target.value })} />
                  <Select value={evForm.verification_method} onChange={e => setEvForm({ ...evForm, verification_method: e.target.value })}>
                    <option value="PORTAL">PORTAL</option><option value="PHONE">PHONE</option><option value="EDI">EDI</option><option value="FAX">FAX</option>
                  </Select>
                  <TextInput placeholder="Reference number" value={evForm.reference_number} onChange={e => setEvForm({ ...evForm, reference_number: e.target.value })} />
                  <TextInput required placeholder="Verified by" value={evForm.verified_by} onChange={e => setEvForm({ ...evForm, verified_by: e.target.value })} />
                  <Button type="submit" variant="ghost">Attach evidence</Button>
                </form>
              </div>
            </Card>
          ) : <Card className="p-5 text-sub text-sm">Select an exception to assign an owner, update status, or attach payer evidence.</Card>}
        </div>
      </div>

      <Card className="mt-5">
        <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
          <h3 className="font-bold">Audit trail</h3>
          <span className="text-xs text-sub">Append-only · 7-year retention per PRD v1.1 · last {audit.length} events</span>
        </div>
        <div className="divide-y divide-line max-h-64 overflow-y-auto">
          {audit.map(a => (
            <div key={a.id} className="px-5 py-2 flex items-center gap-3 text-xs">
              <span className="font-mono text-sub whitespace-nowrap">{String(a.ts).slice(0, 19).replace("T", " ")}</span>
              <Pill tone="blue">{a.actor}</Pill>
              <span className="font-semibold whitespace-nowrap">{a.action}</span>
              <span className="font-mono text-sub">{a.entity_id}</span>
              <span className="text-sub truncate">{a.detail}</span>
            </div>
          ))}
          {audit.length === 0 && <p className="px-5 py-3 text-sub text-sm">No audit events yet.</p>}
        </div>
      </Card>
    </div>
  );
}

// ---------------------------------------------------------------- EDI Intake
function EdiTab({ apiBase, onDataChanged }) {
  const [raw, setRaw] = useState("");
  const [samples, setSamples] = useState(null);
  const [result, setResult] = useState(null);
  const [history, setHistory] = useState([]);
  const [error, setError] = useState(null);

  const loadHistory = useCallback(() => {
    api(apiBase, "/v1/oncology/edi/files").then(setHistory).catch(() => {});
  }, [apiBase]);
  useEffect(() => {
    api(apiBase, "/v1/oncology/edi/samples").then(setSamples).catch(e => setError(e.message));
    loadHistory();
  }, [apiBase, loadHistory]);

  async function ingest() {
    try {
      const r = await api(apiBase, "/v1/oncology/edi/ingest", { method: "POST", body: JSON.stringify({ raw }) });
      setResult(r);
      setError(null);
      loadHistory();
      onDataChanged();
    } catch (e) { setError(e.message); setResult(null); }
  }

  const [decoded, setDecoded] = useState(null);
  const [showRaw, setShowRaw] = useState(false);
  async function decode() {
    try {
      setDecoded(await api(apiBase, "/v1/oncology/edi/decode", { method: "POST", body: JSON.stringify({ raw }) }));
      setError(null);
    } catch (e) { setError(e.message); setDecoded(null); }
  }

  // Turn a stored/returned result object into a readable sentence
  function readable(r) {
    if (!r) return "";
    if (r.summary) return r.summary;
    if (r.claim_id) return `Claim ${r.claim_id} · $${Number(r.billed_amount || 0).toLocaleString()} · ${r.risk_level} risk · ${r.rule_blockers} rule check(s) failed`;
    if (r.actions) return `${r.claims_processed} claim(s) adjudicated: ` + r.actions.map(a =>
      a.action === "denial_recorded" ? `${a.claim_id} denied (CARC ${a.carc})`
        : a.action === "paid_clean" ? `${a.claim_id} paid clean` : `${a.claim_id} unmatched`).join("; ");
    return JSON.stringify(r);
  }

  const [batchResult, setBatchResult] = useState(null);
  async function onFilesPicked(e) {
    const files = [...e.target.files];
    if (!files.length) return;
    try {
      const payload = await Promise.all(files.map(f => f.text().then(text => ({ name: f.name, raw: text }))));
      const r = await api(apiBase, "/v1/oncology/edi/ingest-batch", { method: "POST", body: JSON.stringify({ files: payload }) });
      setBatchResult(r);
      setError(null);
      loadHistory();
      onDataChanged();
    } catch (e2) { setError(e2.message); setBatchResult(null); }
    e.target.value = "";
  }

  return (
    <div>
      <div className="mb-4">
        <h2 className="text-2xl font-bold">EDI intake</h2>
        <p className="text-sm text-sub mt-1">837P professional claims and 835 remittances — the data pipeline that will feed model training (PRD Section 4). Simplified X12 reader; production uses pyx12 with full 005010 guides.</p>
      </div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <div className="flex items-center gap-2 mb-3 flex-wrap">
            <h3 className="font-bold flex-1">Paste X12 transaction</h3>
            {samples && <Button variant="ghost" onClick={() => setRaw(samples.sample_837)}>Load sample 837</Button>}
            {samples && <Button variant="ghost" onClick={() => setRaw(samples.sample_835)}>Load sample 835</Button>}
          </div>
          <textarea rows="9" value={raw} onChange={e => setRaw(e.target.value)}
            placeholder="ISA*00*~ST*837*0001~CLM*..."
            className="w-full bg-page border border-line rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:border-accent" />
          <div className="mt-3 flex gap-2">
            <Button variant="ghost" onClick={decode} disabled={!raw.trim()}>Preview file (nothing saved)</Button>
            <Button onClick={ingest} disabled={!raw.trim()}>Import file</Button>
          </div>
          {result && (
            <div className="mt-4 bg-okbg rounded-lg px-4 py-3">
              <div className="font-bold text-okt text-sm mb-1">Ingested · {result.kind === "837P" ? "837P professional claim" : "835 remittance advice"}</div>
              <p className="text-sm text-okt/90">{readable(result.result)}</p>
              <p className="text-xs text-okt/80 mt-1.5">
                {result.kind === "837P" ? "The claim ran through the L1 rules engine — open Denial Prevention to review it." : "Denials recorded — see Appeals for the drafted package."}
              </p>
            </div>
          )}

          <div className="mt-4 pt-4 border-t border-line">
            <div className="flex items-center justify-between mb-2">
              <h4 className="font-bold text-sm">Batch file upload</h4>
              <span className="text-xs text-sub">.edi / .x12 / .txt · up to 50 files</span>
            </div>
            <label className="block border-2 border-dashed border-line rounded-lg px-4 py-6 text-center text-sm text-sub cursor-pointer hover:border-accent hover:text-accent transition">
              Click to choose files (or drop them on the picker)
              <input type="file" multiple accept=".edi,.x12,.txt,.837,.835,.dat" onChange={onFilesPicked} className="hidden" />
            </label>
            {batchResult && (
              <div className="mt-3 space-y-1.5">
                <div className="text-sm font-semibold">{batchResult.succeeded} of {batchResult.total} files ingested{batchResult.failed > 0 && <span className="text-badt"> · {batchResult.failed} failed</span>}</div>
                {batchResult.results.map((r, i) => (
                  <div key={i} className={`rounded-lg px-3 py-2 text-xs ${r.ok ? "bg-okbg text-okt" : "bg-badbg text-badt"}`}>
                    <span className="font-mono font-semibold">{r.name}</span>
                    {r.ok ? <span> · {r.kind === "837P" ? "837P claim" : "835 remittance"}<div className="mt-0.5">{readable(r.result)}</div></span>
                          : <span> · {r.error}</span>}
                  </div>
                ))}
              </div>
            )}
          </div>
        </Card>
        <div className="space-y-4">
          {decoded && (
            <Card>
              <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
                <h3 className="font-bold">Decoded {decoded.kind === "837P" ? "837P claim" : decoded.kind === "835" ? "835 remittance" : decoded.kind}</h3>
                <button onClick={() => setShowRaw(s => !s)} className="text-xs text-accent hover:underline">{showRaw ? "Hide raw segments" : "Show raw segments"}</button>
              </div>
              <div className="p-5">
                <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">In plain English</h4>
                <ul className="space-y-1 mb-4">
                  {decoded.summary.map((s, i) => (
                    <li key={i} className="text-sm flex gap-2"><span className="text-accent font-bold">·</span>{s}</li>
                  ))}
                </ul>
                <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">Segment breakdown</h4>
                <div className="divide-y divide-line border border-line rounded-lg overflow-hidden">
                  {decoded.segments.map((s, i) => (
                    <div key={i} className="px-3 py-2">
                      <div className="flex items-baseline gap-2">
                        <span className="font-mono text-[10px] font-bold bg-chip text-sub px-1.5 py-0.5 rounded shrink-0">{s.tag}</span>
                        <span className="text-sm font-semibold">{s.name}</span>
                      </div>
                      {s.detail && <div className="text-sm text-ink mt-0.5">{s.detail}</div>}
                      <div className="text-xs text-sub mt-0.5">{s.description}</div>
                      {showRaw && <div className="font-mono text-[11px] text-sub mt-1 break-all bg-page rounded px-2 py-1">{s.raw}</div>}
                    </div>
                  ))}
                </div>
              </div>
            </Card>
          )}
          <Card>
            <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
              <h3 className="font-bold">Import history</h3>
              <span className="text-xs text-sub">{history.length} transactions</span>
            </div>
            <div className="divide-y divide-line max-h-[420px] overflow-y-auto">
              {history.map(h => (
                <div key={h.id} className="px-5 py-3 text-sm">
                  <div className="flex items-center gap-2 mb-1">
                    <Pill tone={h.kind === "837P" ? "blue" : "warn"}>{h.kind === "837P" ? "837P claim" : "835 remittance"}</Pill>
                    <span className="text-xs text-sub">{String(h.ingested_at).slice(0, 16).replace("T", " ")}</span>
                  </div>
                  <div className="text-sm">{readable(h.result)}</div>
                </div>
              ))}
              {history.length === 0 && <p className="px-5 py-3 text-sub text-sm">Nothing ingested yet — try the sample 837, then the sample 835 that denies it.</p>}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Validation
function ValidationTab({ apiBase }) {
  const [report, setReport] = useState(null);
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);

  async function run() {
    setRunning(true);
    try {
      setReport(await api(apiBase, "/v1/oncology/validation/run", { method: "POST" }));
      setError(null);
    } catch (e) { setError(e.message); }
    setRunning(false);
  }

  return (
    <div>
      <div className="flex items-start justify-between mb-4">
        <div>
          <h2 className="text-2xl font-bold">Rules-engine validation</h2>
          <p className="text-sm text-sub mt-1">L1 engine vs expert manual review on a gold-standard scenario set — precision, recall, missed blockers, and false flags (PRD validation milestone).</p>
        </div>
        <Button onClick={run} disabled={running}>{running ? "Running…" : report ? "Re-run validation" : "Run validation"}</Button>
      </div>
      <ErrorBanner msg={error} />

      <Card className="p-5 mb-5">
        <h3 className="font-bold mb-2">Why we validate</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3 text-sm text-sub">
          <div><span className="font-semibold text-ink">Proof, not claims.</span> The product tells billing staff a claim will deny. This measures how often that judgement matches an expert's — the answer to "how accurate is it?" from partners and investors.</div>
          <div><span className="font-semibold text-ink">Trust before automation.</span> Staff won't let software block a claim until they know its false-flag rate. Precision tells them how often it cries wolf; recall tells them what it lets through.</div>
          <div><span className="font-semibold text-ink">Regression safety.</span> Every rule change re-runs the whole scenario set, so a new rule that quietly breaks an existing check is caught immediately rather than in production.</div>
          <div><span className="font-semibold text-ink">It maps the roadmap.</span> The misses are the point: blockers rules can't catch (e.g. insufficient documentation) are exactly what the ML layer in the PRD is for — quantified, not asserted.</div>
        </div>
        <p className="text-xs text-sub mt-3 pt-3 border-t border-line">
          <span className="font-semibold">How to read it:</span> <b>Precision</b> = of everything flagged, how much was truly a blocker. <b>Recall</b> = of every true blocker, how much was caught. <b>F1</b> balances the two. Expert labels are the gold standard; the engine is scored against them.
        </p>
      </Card>

      {report ? (
        <React.Fragment>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
            <Card className="p-4"><div className="text-xs text-sub">Scenarios</div><div className="text-3xl font-bold font-mono mt-1">{report.scenarios}</div><div className="text-xs text-sub mt-1.5">{report.exact_match} exact matches</div></Card>
            <Card className="p-4"><div className="text-xs text-sub">Precision</div><div className="text-3xl font-bold font-mono mt-1 text-okt">{(report.precision * 100).toFixed(1)}%</div><div className="text-xs text-sub mt-1.5">{report.false_positives} false flag(s)</div></Card>
            <Card className="p-4"><div className="text-xs text-sub">Recall</div><div className="text-3xl font-bold font-mono mt-1 text-accent">{(report.recall * 100).toFixed(1)}%</div><div className="text-xs text-sub mt-1.5">{report.false_negatives} missed blocker(s)</div></Card>
            <Card className="p-4"><div className="text-xs text-sub">F1</div><div className="text-3xl font-bold font-mono mt-1">{(report.f1 * 100).toFixed(1)}%</div><div className="text-xs text-sub mt-1.5">harmonic mean</div></Card>
            <Card className="p-4"><div className="text-xs text-sub">True positives</div><div className="text-3xl font-bold font-mono mt-1">{report.true_positives}</div><div className="text-xs text-sub mt-1.5">blockers correctly caught</div></Card>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <Card>
              <div className="px-5 py-3.5 border-b border-line"><h3 className="font-bold text-badt">Missed blockers (false negatives)</h3></div>
              <div className="divide-y divide-line">
                {report.missed_blockers.map((m, i) => (
                  <div key={i} className="px-5 py-3 text-sm">
                    <span className="font-mono text-xs bg-badbg text-badt px-1.5 py-0.5 rounded mr-2">{m.scenario}</span>
                    <span className="font-mono text-xs">{m.rule}</span>
                    <div className="text-xs text-sub mt-1">{m.description}</div>
                  </div>
                ))}
                {report.missed_blockers.length === 0 && <p className="px-5 py-3 text-sub text-sm">None — the engine caught every expert-flagged blocker.</p>}
              </div>
            </Card>
            <Card>
              <div className="px-5 py-3.5 border-b border-line"><h3 className="font-bold text-warnt">False flags (false positives)</h3></div>
              <div className="divide-y divide-line">
                {report.false_flags.map((m, i) => (
                  <div key={i} className="px-5 py-3 text-sm">
                    <span className="font-mono text-xs bg-warnbg text-warnt px-1.5 py-0.5 rounded mr-2">{m.scenario}</span>
                    <span className="font-mono text-xs">{m.rule}</span>
                    <div className="text-xs text-sub mt-1">{m.description}</div>
                  </div>
                ))}
                {report.false_flags.length === 0 && <p className="px-5 py-3 text-sub text-sm">None — no rule fired where the expert saw no issue.</p>}
              </div>
            </Card>
          </div>
          <Card>
            <div className="px-5 py-3.5 border-b border-line"><h3 className="font-bold">Scenario detail</h3></div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-[11px] uppercase tracking-wider text-sub border-b border-line">
                    <th className="px-5 py-2.5">Scenario</th><th className="pr-3">Description</th>
                    <th className="pr-3">Expert flagged</th><th className="pr-3">Engine flagged</th><th className="pr-3">Match</th>
                  </tr>
                </thead>
                <tbody>
                  {report.details.map(d => (
                    <tr key={d.scenario_id} className="border-b border-line align-top">
                      <td className="px-5 py-2.5 font-mono text-xs font-semibold">{d.scenario_id}</td>
                      <td className="pr-3 text-xs text-sub max-w-[220px]">{d.description}</td>
                      <td className="pr-3 font-mono text-xs">{d.expert.join(", ") || "—"}</td>
                      <td className="pr-3 font-mono text-xs">{d.engine.join(", ") || "—"}</td>
                      <td className="pr-3">{d.match ? <Pill tone="ok">Match</Pill> : <Pill tone="bad">Diff</Pill>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
          <p className="text-xs text-sub mt-3">{report.note}</p>
        </React.Fragment>
      ) : (
        <Card className="p-8 text-center">
          <h3 className="font-bold text-lg mb-1">No validation run yet</h3>
          <p className="text-sm text-sub">Run the gold-standard scenario set to measure the rules engine against expert review — the numbers design partners and investors will ask for.</p>
        </Card>
      )}
    </div>
  );
}

// ---------------------------------------------------------------- Connections
function ConnectTab({ apiBase, go }) {
  const [cfg, setCfg] = useState(null);
  const [form, setForm] = useState({ partner_id: "mock", mode: "mock", base_url: "", api_key: "", trading_partner_id: "" });
  const [cases, setCases] = useState([]);
  const [claims, setClaims] = useState([]);
  const [caseId, setCaseId] = useState("");
  const [claimId, setClaimId] = useState("");
  const [log, setLog] = useState([]);
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState("");
  const [error, setError] = useState(null);
  const [copied, setCopied] = useState(false);

  const loadAll = useCallback(() => {
    api(apiBase, "/v1/connect/config").then(c => {
      setCfg(c);
      setForm(f => ({ ...f, partner_id: c.partner_id, mode: c.mode, base_url: c.base_url, trading_partner_id: c.trading_partner_id }));
    }).catch(e => setError(e.message));
    api(apiBase, "/v1/connect/log?limit=60").then(setLog).catch(() => {});
    api(apiBase, "/v1/oncology/previsit/cases").then(d => { setCases(d); if (d[0]) setCaseId(c => c || d[0].case_id); }).catch(() => {});
    api(apiBase, "/v1/oncology/precheck/claims").then(d => { setClaims(d); if (d[0]) setClaimId(c => c || d[0].claim_id); }).catch(() => {});
  }, [apiBase]);
  useEffect(() => { loadAll(); }, [loadAll]);

  async function saveCfg(e) {
    e.preventDefault();
    try {
      const c = await api(apiBase, "/v1/connect/config", { method: "POST", body: JSON.stringify(form) });
      setCfg(c); setMsg("Partner connection saved."); setError(null);
    } catch (e2) { setError(e2.message); }
  }
  async function run(label, path, body) {
    setBusy(label); setMsg(null);
    try {
      const r = await api(apiBase, path, { method: "POST", body: JSON.stringify(body || {}) });
      setMsg(typeof r === "object" ? summarize(label, r) : String(r));
      setError(null);
      loadAll();
    } catch (e2) { setError(e2.message); }
    setBusy("");
  }
  function summarize(label, r) {
    if (label === "eligibility") return `271 received — coverage ${r.response.eligibility}${r.benefits_updated ? ", benefit accumulators updated" : ""} (trace ${r.response.trace || "n/a"})`;
    if (label === "submit") return `837 ${r.acknowledgement.status} — ${r.acknowledgement.message || ""} (trace ${r.acknowledgement.trace || "n/a"})`;
    if (label === "poll") return `${r.remits_processed} remittance(s) processed` + (r.results[0] ? ` — ${r.results[0].summary}` : "");
    return "Done";
  }

  const dirTone = d => d === "outbound" ? "blue" : "ok";
  const statusTone = s => s === "rejected" || s === "error" ? "bad" : s === "accepted" || s === "received" ? "ok" : "warn";

  return (
    <div>
      <div className="mb-4">
        <h2 className="text-2xl font-bold">Connections</h2>
        <p className="text-sm text-sub mt-1">Real-time exchange with clearinghouses and EHRs — 270/271 eligibility, 837 claim submission, 835 remittance, and partner-pushed webhooks. Adapters isolate transport, so a live partner is a credentials change, not a rebuild.</p>
      </div>
      <ErrorBanner msg={error} />
      {msg && <div className="mb-4 bg-okbg text-okt text-sm rounded-lg px-4 py-3">{msg}</div>}

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2 space-y-4">
          <Card className="p-5">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-bold">Trading partner</h3>
              {cfg && <Pill tone={cfg.mode === "mock" ? "warn" : "ok"}>{cfg.mode === "mock" ? "simulator" : cfg.mode}</Pill>}
            </div>
            {cfg && (
              <form onSubmit={saveCfg} className="space-y-2.5">
                <div>
                  <Label>Partner</Label>
                  <Select value={form.partner_id} onChange={e => {
                    const p = cfg.presets.find(x => x.id === e.target.value);
                    setForm({ ...form, partner_id: e.target.value, mode: p ? p.mode : "rest", base_url: p ? p.base_url : "" });
                  }}>
                    {cfg.presets.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </Select>
                </div>
                {form.mode !== "mock" && (
                  <React.Fragment>
                    <div><Label>API base URL</Label><TextInput value={form.base_url} onChange={e => setForm({ ...form, base_url: e.target.value })} className="font-mono text-xs" /></div>
                    <div><Label>API key / bearer token</Label><TextInput type="password" value={form.api_key} onChange={e => setForm({ ...form, api_key: e.target.value })} placeholder={cfg.has_api_key ? "•••••• saved" : "from your partner portal"} /></div>
                  </React.Fragment>
                )}
                <div><Label>Trading partner ID</Label><TextInput value={form.trading_partner_id} onChange={e => setForm({ ...form, trading_partner_id: e.target.value })} className="font-mono text-xs" /></div>
                <Button type="submit">Save connection</Button>
              </form>
            )}
          </Card>

          <Card className="p-5">
            <h3 className="font-bold mb-1">Inbound webhook</h3>
            <p className="text-xs text-sub mb-2">Give this to the partner for real-time 835/277 pushes. Requests must carry <span className="font-mono">X-Signature: sha256=…</span> (HMAC of the body using the secret).</p>
            {cfg && (
              <React.Fragment>
                <div className="flex gap-2">
                  <TextInput readOnly value={cfg.webhook_url} className="font-mono text-xs" />
                  <Button variant="ghost" onClick={() => { navigator.clipboard.writeText(cfg.webhook_url); setCopied(true); setTimeout(() => setCopied(false), 1500); }}>{copied ? "Copied ✓" : "Copy"}</Button>
                </div>
                <p className="text-[11px] text-sub mt-1.5">Secret: <span className="font-mono">{cfg.webhook_secret.slice(0, 8)}…</span></p>
                {!cfg.webhook_public && (
                  <p className="text-xs text-warnt bg-warnbg rounded px-3 py-2 mt-2">
                    Local address — partners can't reach it. Run <span className="font-mono">tunnel.bat</span> for a public HTTPS URL, or deploy the backend.
                  </p>
                )}
              </React.Fragment>
            )}
          </Card>
        </div>

        <div className="lg:col-span-3 space-y-4">
          <Card className="p-5">
            <h3 className="font-bold mb-3">Run a transaction</h3>
            <div className="space-y-3">
              <div className="flex items-end gap-2 flex-wrap">
                <div className="flex-1 min-w-[180px]">
                  <Label>270 · Real-time eligibility for case</Label>
                  <Select value={caseId} onChange={e => setCaseId(e.target.value)}>
                    {cases.map(c => <option key={c.case_id} value={c.case_id}>{c.patient_name || c.patient_ref} · {c.case_id}</option>)}
                  </Select>
                </div>
                <Button disabled={busy === "eligibility" || !caseId} onClick={() => run("eligibility", "/v1/connect/eligibility", { case_id: caseId })}>
                  {busy === "eligibility" ? "Checking…" : "Check eligibility"}
                </Button>
              </div>
              <div className="flex items-end gap-2 flex-wrap">
                <div className="flex-1 min-w-[180px]">
                  <Label>837 · Submit claim</Label>
                  <Select value={claimId} onChange={e => setClaimId(e.target.value)}>
                    {claims.map(c => <option key={c.claim_id} value={c.claim_id}>{c.patient_name || c.claim_id} · {money(c.billed_amount)}{c.rule_blockers.length ? ` · ${c.rule_blockers.length} blocker(s)` : ""}</option>)}
                  </Select>
                </div>
                <Button disabled={busy === "submit" || !claimId} onClick={() => run("submit", "/v1/connect/submit", { claim_id: claimId })}>
                  {busy === "submit" ? "Submitting…" : "Submit claim"}
                </Button>
              </div>
              <div className="flex items-center justify-between gap-2 pt-2 border-t border-line">
                <span className="text-sm text-sub">835 · Pull available remittances and post denials automatically</span>
                <Button variant="ghost" disabled={busy === "poll"} onClick={() => run("poll", "/v1/connect/poll-remits")}>
                  {busy === "poll" ? "Polling…" : "Poll remittances"}
                </Button>
              </div>
            </div>
            <p className="text-xs text-sub mt-3 pt-3 border-t border-line">Claim submission is blocked while hard rule failures are open — the point of the product. Resolve the exception first, or the API can force it for testing.</p>
          </Card>

          <Card>
            <div className="px-5 py-3.5 border-b border-line flex items-center justify-between">
              <h3 className="font-bold">Message history</h3>
              <span className="text-xs text-sub">{log.length} transactions</span>
            </div>
            <div className="divide-y divide-line max-h-[380px] overflow-y-auto">
              {log.map(x => (
                <div key={x.id} className="px-5 py-2.5 text-sm">
                  <div className="flex items-center gap-2 flex-wrap">
                    <Pill tone={dirTone(x.direction)}>{x.direction === "outbound" ? "→ sent" : "← received"}</Pill>
                    <span className="font-mono text-xs font-bold">{x.kind}</span>
                    <Pill tone={statusTone(x.status)}>{x.status}</Pill>
                    {x.reference && <span className="font-mono text-xs text-sub">{x.reference}</span>}
                    <span className="text-xs text-sub ml-auto">{String(x.ts).slice(0, 19).replace("T", " ")}</span>
                  </div>
                  {x.detail && <div className="text-xs text-sub mt-0.5">{x.detail}</div>}
                </div>
              ))}
              {log.length === 0 && <p className="px-5 py-3 text-sub text-sm">No exchanges yet — run an eligibility check or submit a claim above.</p>}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- FHIR / Epic
function FhirTab({ apiBase, go }) {
  const [config, setConfig] = useState(null);
  const [baseUrl, setBaseUrl] = useState("");
  const [token, setToken] = useState("");
  const [query, setQuery] = useState("");
  const [patients, setPatients] = useState(null);
  const [summary, setSummary] = useState(null);
  const [importMsg, setImportMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const [epic, setEpic] = useState(null);
  const [clientId, setClientId] = useState("");
  const [epicMsg, setEpicMsg] = useState(null);
  const [copied, setCopied] = useState(false);

  const loadEpic = useCallback(() => {
    api(apiBase, "/v1/fhir/epic/status").then(s => { setEpic(s); if (s.client_id) setClientId(s.client_id); }).catch(() => {});
  }, [apiBase]);

  useEffect(() => {
    api(apiBase, "/v1/fhir/config").then(c => { setConfig(c); setBaseUrl(c.base_url); }).catch(e => setError(e.message));
    loadEpic();
  }, [apiBase, loadEpic]);

  async function connectEpic(e) {
    e.preventDefault();
    setEpicMsg("Requesting token from Epic…");
    try {
      const r = await api(apiBase, "/v1/fhir/epic/connect", { method: "POST", body: JSON.stringify({ client_id: clientId }) });
      setEpicMsg(`Connected to Epic — token valid ${Math.round((r.expires_in || 3600) / 60)} min (auto-renews).`);
      setError(null);
      loadEpic();
      api(apiBase, "/v1/fhir/config").then(c => { setConfig(c); setBaseUrl(c.base_url); });
    } catch (e2) { setEpicMsg(null); setError(e2.message); }
  }

  async function saveConfig(e) {
    e.preventDefault();
    try {
      const c = await api(apiBase, "/v1/fhir/config", { method: "POST", body: JSON.stringify({ base_url: baseUrl, token }) });
      setConfig(c); setToken(""); setError(null);
      setPatients(null); setSummary(null);
    } catch (e2) { setError(e2.message); }
  }
  const [dob, setDob] = useState("");
  const [sandbox, setSandbox] = useState(null);
  useEffect(() => { api(apiBase, "/v1/fhir/sandbox-patients").then(setSandbox).catch(() => {}); }, [apiBase, config]);

  async function doSearch(params) {
    setBusy(true); setSummary(null);
    try {
      const qs = new URLSearchParams(params).toString();
      setPatients(await api(apiBase, "/v1/fhir/patients" + (qs ? "?" + qs : "")));
      setError(null);
    } catch (e2) { setError(e2.message); setPatients(null); }
    setBusy(false);
  }
  function search(e) {
    e.preventDefault();
    const p = {};
    if (query.trim()) p.name = query.trim();
    if (dob) p.birthdate = dob;
    doSearch(p);
  }
  async function openPatient(id) {
    setBusy(true);
    try {
      setSummary(await api(apiBase, `/v1/fhir/patients/${id}/summary`));
      setImportMsg(null); setError(null);
    } catch (e2) { setError(e2.message); }
    setBusy(false);
  }
  async function doImport() {
    setBusy(true);
    try {
      const r = await api(apiBase, `/v1/fhir/import/${summary.patient.id}`, { method: "POST" });
      setImportMsg(r.case.case_id);
      setError(null);
    } catch (e2) { setError(e2.message); }
    setBusy(false);
  }

  return (
    <div>
      <div className="mb-4">
        <h2 className="text-2xl font-bold">FHIR / Epic connector</h2>
        <p className="text-sm text-sub mt-1">Live FHIR R4 reads (Patient · Condition · Coverage) — the same resource layer the Epic SMART on FHIR integration uses (PRD Section 8, milestone M9). Production Epic requires App Orchard registration; the Epic sandbox works with a free developer token from fhir.epic.com.</p>
      </div>
      <ErrorBanner msg={error} />
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2 space-y-4">
          <Card className="p-5">
            <div className="flex items-center justify-between mb-1">
              <h3 className="font-bold">Epic connection</h3>
              {epic && (epic.connected
                ? <Pill tone="ok">connected · {Math.round(epic.token_valid_seconds / 60)} min left</Pill>
                : <Pill tone="warn">not connected</Pill>)}
            </div>
            <p className="text-xs text-sub mb-3">Backend Services OAuth — the server signs the JWT and renews tokens automatically. No manual token pasting.</p>
            {epic && (
              <div className="space-y-3">
                <div>
                  <Label>Step 1 · Your JWK Set URL (paste into Epic)</Label>
                  <div className="flex gap-2">
                    <TextInput readOnly value={epic.jwks_url} className="font-mono text-xs" />
                    <Button variant="ghost" onClick={() => { navigator.clipboard.writeText(epic.jwks_url); setCopied(true); setTimeout(() => setCopied(false), 1500); }}>{copied ? "Copied ✓" : "Copy"}</Button>
                  </div>
                  {!epic.jwks_public && (
                    <p className="text-xs text-sub bg-page rounded px-3 py-2 mt-1.5">
                      This local address isn't reachable by Epic — that's fine if you've published the same key elsewhere (e.g. a GitHub gist or your deployed backend at <span className="font-mono">/jwks.json</span>). Epic only needs to fetch the public key; token requests go outbound from this server.
                    </p>
                  )}
                  <p className="text-xs text-sub mt-1.5">
                    <span className="font-semibold">Getting <span className="font-mono">invalid_client</span>?</span> Epic can take up to 12 hours to sync a newly published JWK Set. Confirm the URL saved in Epic and that the app audience is <b>Backend Systems</b>, then retry — no changes needed here.
                  </p>
                  <p className="text-[11px] text-sub mt-1">Key ID (kid): <span className="font-mono">{epic.kid.slice(0, 22)}…</span></p>
                </div>
                <form onSubmit={connectEpic}>
                  <Label>Step 2 · Non-production Client ID from fhir.epic.com</Label>
                  <div className="flex gap-2">
                    <TextInput value={clientId} onChange={e => setClientId(e.target.value)} placeholder="e.g. 0oa3…" className="font-mono text-xs" />
                    <Button type="submit" disabled={!clientId.trim()}>{epic.connected ? "Reconnect" : "Connect"}</Button>
                  </div>
                </form>
                {epicMsg && <p className="text-xs text-okt bg-okbg rounded px-3 py-2">{epicMsg}</p>}
              </div>
            )}
          </Card>
          <Card className="p-5">
            <h3 className="font-bold mb-3">FHIR server</h3>
            {config && (
              <form onSubmit={saveConfig} className="space-y-2.5">
                <div>
                  <Label>Preset</Label>
                  <Select value={config.presets.find(p => p.base_url === baseUrl) ? baseUrl : "custom"}
                    onChange={e => { if (e.target.value !== "custom") setBaseUrl(e.target.value); }}>
                    {config.presets.map(p => <option key={p.id} value={p.base_url}>{p.label}</option>)}
                    <option value="custom">Custom URL…</option>
                  </Select>
                </div>
                <div><Label>Base URL</Label><TextInput value={baseUrl} onChange={e => setBaseUrl(e.target.value)} className="font-mono text-xs" /></div>
                <div><Label>Bearer token (Epic sandbox / secured servers)</Label>
                  <TextInput type="password" value={token} onChange={e => setToken(e.target.value)}
                    placeholder={config.has_token ? "•••••• saved — enter to replace" : "leave empty for open sandboxes"} /></div>
                <Button type="submit">Save connection</Button>
              </form>
            )}
          </Card>
          <Card className="p-5">
            <h3 className="font-bold mb-3">Find patients</h3>
            {sandbox && sandbox.is_epic && (
              <div className="mb-3">
                <Label>Epic sandbox patients (one click)</Label>
                <div className="flex flex-wrap gap-1.5">
                  {sandbox.patients.map(p => (
                    <button key={p.label} onClick={() => doSearch({ given: p.given, family: p.family, birthdate: p.birthdate })}
                      className="px-2.5 py-1 rounded-full text-xs font-semibold bg-chip text-sub hover:bg-accentbg hover:text-accent transition">
                      {p.given} {p.family}
                    </button>
                  ))}
                </div>
                <p className="text-[11px] text-sub mt-1.5">Epic requires exact demographics — free-text search alone returns nothing.</p>
              </div>
            )}
            <form onSubmit={search} className="space-y-2">
              <div className="flex gap-2">
                <TextInput value={query} onChange={e => setQuery(e.target.value)} placeholder="First and last name" />
                <TextInput type="date" value={dob} onChange={e => setDob(e.target.value)} className="w-40" title="Birth date (Epic matches on it)" />
              </div>
              <Button type="submit" disabled={busy}>{busy ? "Searching…" : "Search"}</Button>
            </form>
            {patients && (
              <div className="divide-y divide-line mt-3 -mx-5">
                {patients.map(p => (
                  <div key={p.id} onClick={() => openPatient(p.id)}
                    className={`px-5 py-2.5 cursor-pointer hover:bg-hoverbg ${summary && summary.patient.id === p.id ? "bg-accentsel" : ""}`}>
                    <div className="font-semibold text-sm">{p.name}</div>
                    <div className="text-xs text-sub">{p.gender} · born <span className="font-mono">{p.birthDate || "?"}</span> · <span className="font-mono">{p.id}</span></div>
                  </div>
                ))}
                {patients.length === 0 && <p className="px-5 py-3 text-sub text-sm">No patients found.</p>}
              </div>
            )}
          </Card>
        </div>

        <div className="lg:col-span-3">
          {summary ? (
            <Card className="p-5">
              <div className="flex items-start justify-between mb-1">
                <div>
                  <h3 className="text-xl font-bold">{summary.patient.name}</h3>
                  <p className="text-sm text-sub">{summary.age_sex} · {summary.patient.gender} · born <span className="font-mono">{summary.patient.birthDate || "?"}</span></p>
                  <p className="text-xs text-sub font-mono mt-0.5">FHIR Patient/{summary.patient.id}</p>
                </div>
                <Button onClick={doImport} disabled={busy}>{busy ? "Importing…" : "Import as pre-visit case"}</Button>
              </div>
              {importMsg && (
                <div className="bg-okbg text-okt rounded-lg px-4 py-3 mt-3 text-sm flex items-center justify-between">
                  <span>Imported — L0 checks ran on <span className="font-mono font-semibold">{importMsg}</span></span>
                  <button onClick={() => go("previsit", { caseId: importMsg })} className="font-semibold hover:underline">Open case →</button>
                </div>
              )}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                  <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">Conditions ({summary.conditions.length})</h4>
                  <div className="space-y-1.5">
                    {summary.conditions.map((c, i) => (
                      <div key={i} className="bg-page rounded-lg px-3 py-2 text-sm">
                        {c.text}
                        <div className="text-xs text-sub font-mono">{c.icd10 || "no ICD-10 coding"} {c.status && `· ${c.status}`}</div>
                      </div>
                    ))}
                    {summary.conditions.length === 0 && <p className="text-xs text-sub">None on file for this patient.</p>}
                  </div>
                </div>
                <div>
                  <h4 className="text-[11px] uppercase tracking-wider text-sub font-semibold mb-2">Coverage ({summary.coverage.length})</h4>
                  <div className="space-y-1.5">
                    {summary.coverage.map((c, i) => (
                      <div key={i} className="bg-page rounded-lg px-3 py-2 text-sm">
                        {c.payor}
                        <div className="text-xs text-sub">{c.plan} {c.status && <Pill tone={c.status === "active" ? "ok" : "gray"}>{c.status}</Pill>}</div>
                      </div>
                    ))}
                    {summary.coverage.length === 0 && <p className="text-xs text-sub">No coverage resources — import will flag eligibility for verification.</p>}
                  </div>
                </div>
              </div>
            </Card>
          ) : (
            <Card className="p-8 text-center">
              <h3 className="font-bold text-lg mb-1">No patient selected</h3>
              <p className="text-sm text-sub">Search the connected FHIR server and click a patient to see demographics, conditions, and coverage — then import them straight into the pre-visit pipeline.</p>
            </Card>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ apiBase, onLogin }) {
  const [username, setUsername] = useState("admin");
  const [password, setPassword] = useState("");
  const [challenge, setChallenge] = useState(null);
  const [mfaMethod, setMfaMethod] = useState("totp");
  const [phoneHint, setPhoneHint] = useState("");
  const [code, setCode] = useState("");
  const [demoCode, setDemoCode] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submitPassword(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      const r = await api(apiBase, "/v1/auth/login", { method: "POST", body: JSON.stringify({ username, password }) });
      if (r.mfa_required) {
        setChallenge(r.challenge);
        setMfaMethod(r.method || "totp");
        setPhoneHint(r.phone_hint || "");
        api(apiBase, `/v1/auth/mfa/demo-code?challenge=${encodeURIComponent(r.challenge)}`).then(setDemoCode).catch(() => {});
      } else {
        onLogin(r.token, r.username);
      }
    } catch (e2) { setError("Invalid username or password"); }
    setBusy(false);
  }

  async function resendSms() {
    try {
      await api(apiBase, `/v1/auth/mfa/resend-sms?challenge=${encodeURIComponent(challenge)}`, { method: "POST" });
      api(apiBase, `/v1/auth/mfa/demo-code?challenge=${encodeURIComponent(challenge)}`).then(setDemoCode).catch(() => {});
      setError(null);
    } catch (e2) { setError("Could not resend code"); }
  }

  async function submitCode(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      const r = await api(apiBase, "/v1/auth/mfa/verify", { method: "POST", body: JSON.stringify({ challenge, code }) });
      onLogin(r.token, r.username);
    } catch (e2) { setError("Invalid authenticator code"); }
    setBusy(false);
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <Card className="p-8 w-full max-w-sm">
        <div className="flex items-center gap-2.5 mb-6">
          <span className="w-10 h-10 rounded-xl bg-accent flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2l7 10-7 10-7-10z"/></svg>
          </span>
          <div>
            <div className="font-bold">NetGain Innovations</div>
            <div className="text-xs text-sub">Oncology RCM Workspace</div>
          </div>
        </div>
        {!challenge ? (
          <form onSubmit={submitPassword} className="space-y-3">
            <div><Label>Username</Label><TextInput value={username} onChange={e => setUsername(e.target.value)} autoFocus /></div>
            <div><Label>Password</Label><TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} /></div>
            {error && <p className="text-xs text-badt">{error}</p>}
            <Button type="submit" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</Button>
            <p className="text-xs text-sub pt-2 border-t border-line">Demo credentials: <span className="font-mono">admin</span> / <span className="font-mono">precheck123</span></p>
          </form>
        ) : (
          <form onSubmit={submitCode} className="space-y-3">
            <div className="bg-accentbg text-accent text-sm rounded-lg px-4 py-3">
              {mfaMethod === "sms"
                ? <span>We sent a 6-digit code by text to <span className="font-mono font-semibold">{phoneHint}</span>.</span>
                : "Two-factor authentication is enabled. Enter the 6-digit code from your authenticator app."}
            </div>
            <div><Label>{mfaMethod === "sms" ? "Text-message code" : "Authenticator code"}</Label>
              <TextInput value={code} onChange={e => setCode(e.target.value)} placeholder="123456" autoFocus className="font-mono" /></div>
            {demoCode && <p className="text-xs text-warnt bg-warnbg rounded px-3 py-2">Demo helper: current code is <span className="font-mono font-bold">{demoCode.code}</span> (disabled in production)</p>}
            {error && <p className="text-xs text-badt">{error}</p>}
            <div className="flex items-center gap-3">
              <Button type="submit" disabled={busy}>{busy ? "Verifying…" : "Verify"}</Button>
              {mfaMethod === "sms" && <button type="button" onClick={resendSms} className="text-xs text-accent hover:underline">Resend code</button>}
            </div>
            <button type="button" onClick={() => { setChallenge(null); setCode(""); }} className="text-xs text-sub hover:underline">← Back to password</button>
          </form>
        )}
        <p className="text-[11px] text-sub mt-6">Fictional demo environment — do not enter real credentials or PHI.</p>
      </Card>
    </div>
  );
}

function AccountPanel({ apiBase, me, onClose, onChanged }) {
  const [method, setMethod] = useState("totp");
  const [setup, setSetup] = useState(null);
  const [smsSetup, setSmsSetup] = useState(null);
  const [country, setCountry] = useState("+1");
  const [phone, setPhone] = useState("");
  const [code, setCode] = useState("");
  const [demoCode, setDemoCode] = useState(null);
  const [msg, setMsg] = useState(null);
  const [error, setError] = useState(null);

  async function startSetup() {
    try {
      const s = await api(apiBase, "/v1/auth/mfa/setup", { method: "POST" });
      setSetup(s); setSmsSetup(null); setMsg(null); setError(null);
      api(apiBase, "/v1/auth/mfa/demo-code").then(setDemoCode).catch(() => {});
    } catch (e) { setError(e.message); }
  }
  async function startSmsSetup(e) {
    e.preventDefault();
    try {
      const s = await api(apiBase, "/v1/auth/mfa/setup-sms", { method: "POST", body: JSON.stringify({ country_code: country, phone }) });
      setSmsSetup(s); setSetup(null); setMsg(null); setError(null);
      api(apiBase, "/v1/auth/mfa/demo-code").then(setDemoCode).catch(() => {});
    } catch (e2) { setError(String(e2.message).includes("422") ? "Check the country code and phone number" : e2.message); }
  }
  async function enable(e) {
    e.preventDefault();
    try {
      const endpoint = smsSetup ? "/v1/auth/mfa/enable-sms" : "/v1/auth/mfa/enable";
      await api(apiBase, endpoint, { method: "POST", body: JSON.stringify({ code }) });
      setMsg(smsSetup ? "SMS MFA enabled — a code will be texted at each sign-in." : "Authenticator MFA enabled — you'll be asked for a code at next sign-in.");
      setSetup(null); setSmsSetup(null); setCode(""); setError(null);
      onChanged();
    } catch (e2) { setError("Invalid code — try again"); }
  }
  async function disable(e) {
    e.preventDefault();
    try {
      await api(apiBase, "/v1/auth/mfa/disable", { method: "POST", body: JSON.stringify({ code }) });
      setMsg("MFA disabled.");
      setCode(""); setError(null);
      onChanged();
    } catch (e2) { setError("Invalid code — try again"); }
  }

  // --- user management (admin only) ---
  const [users, setUsers] = useState([]);
  const [nu, setNu] = useState({ username: "", password: "", role: "billing" });
  const [umMsg, setUmMsg] = useState(null);
  const loadUsers = useCallback(() => {
    if (me.role === "admin") api(apiBase, "/v1/auth/users").then(setUsers).catch(() => {});
  }, [apiBase, me.role]);
  useEffect(() => { loadUsers(); }, [loadUsers]);

  async function createUser(e) {
    e.preventDefault();
    try {
      await api(apiBase, "/v1/auth/users", { method: "POST", body: JSON.stringify(nu) });
      setUmMsg(`User ${nu.username} created (${nu.role})`);
      setNu({ username: "", password: "", role: "billing" });
      loadUsers();
    } catch (e2) { setUmMsg(e2.message); }
  }
  async function changeRole(username, role) {
    try {
      await api(apiBase, `/v1/auth/users/${username}`, { method: "PATCH", body: JSON.stringify({ role }) });
      setUmMsg(`${username} → ${role}`);
      loadUsers();
    } catch (e2) { setUmMsg(e2.message); }
  }
  async function removeUser(username) {
    try {
      await api(apiBase, `/v1/auth/users/${username}`, { method: "DELETE" });
      setUmMsg(`${username} deleted`);
      loadUsers();
    } catch (e2) { setUmMsg(e2.message); }
  }
  async function resetPassword(username) {
    const pw = prompt(`New password for ${username} (min 8 chars):`);
    if (!pw) return;
    try {
      await api(apiBase, `/v1/auth/users/${username}`, { method: "PATCH", body: JSON.stringify({ password: pw }) });
      setUmMsg(`Password reset for ${username}`);
    } catch (e2) { setUmMsg(e2.message); }
  }

  return (
    <div className="fixed inset-0 bg-black/30 z-50 flex items-start justify-end p-4" onClick={onClose}>
      <Card className="p-5 w-full max-w-md mt-14 max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
        <div onClick={e => e.stopPropagation()}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold">Account security</h3>
            <button onClick={onClose} className="text-sub hover:text-ink text-lg leading-none">×</button>
          </div>
          <p className="text-sm text-sub mb-3">
            Signed in as <span className="font-semibold text-ink">{me.username}</span> <Pill tone="blue">{me.role}</Pill> · MFA{" "}
            {me.mfa_enabled
              ? <Pill tone="ok">{me.mfa_method === "sms" ? `SMS ${me.phone_hint}` : "authenticator app"}</Pill>
              : <Pill tone="warn">off</Pill>}
          </p>
          {msg && <p className="text-xs text-okt bg-okbg rounded px-3 py-2 mb-3">{msg}</p>}
          {error && <p className="text-xs text-badt bg-badbg rounded px-3 py-2 mb-3">{error}</p>}
          {!me.mfa_enabled && !setup && !smsSetup && (
            <div className="space-y-2">
              <Label>Choose a second factor</Label>
              <div className="flex gap-2">
                <button onClick={() => setMethod("totp")} className={`flex-1 px-3 py-2 rounded-lg text-xs font-semibold border ${method === "totp" ? "border-accent bg-accentbg text-accent" : "border-line text-sub"}`}>Authenticator app<br /><span className="font-normal">Google Auth / Authy</span></button>
                <button onClick={() => setMethod("sms")} className={`flex-1 px-3 py-2 rounded-lg text-xs font-semibold border ${method === "sms" ? "border-accent bg-accentbg text-accent" : "border-line text-sub"}`}>Text message<br /><span className="font-normal">code sent by SMS</span></button>
              </div>
              {method === "totp" ? (
                <Button onClick={startSetup}>Set up authenticator MFA</Button>
              ) : (
                <form onSubmit={startSmsSetup} className="space-y-2">
                  <div className="flex gap-2">
                    <select value={country} onChange={e => setCountry(e.target.value)}
                      className="bg-card border border-line rounded-lg px-2 py-1.5 text-sm w-40 focus:outline-none focus:border-accent">
                      {COUNTRY_CODES.map(([c, name]) => <option key={c} value={c}>{c} {name}</option>)}
                    </select>
                    <TextInput value={phone} onChange={e => setPhone(e.target.value)} placeholder="Phone number" className="font-mono" />
                  </div>
                  <Button type="submit">Send verification code</Button>
                </form>
              )}
            </div>
          )}
          {setup && (
            <div className="space-y-3">
              <p className="text-xs text-sub">Add this secret to Google Authenticator or Authy (choose "enter key manually"):</p>
              <div className="bg-page rounded-lg px-3 py-2 font-mono text-sm break-all select-all">{setup.secret}</div>
              {demoCode && <p className="text-xs text-warnt bg-warnbg rounded px-3 py-2">Demo helper — current code: <span className="font-mono font-bold">{demoCode.code}</span></p>}
              <form onSubmit={enable} className="flex gap-2">
                <TextInput value={code} onChange={e => setCode(e.target.value)} placeholder="6-digit code" className="font-mono" />
                <Button type="submit">Confirm</Button>
              </form>
            </div>
          )}
          {smsSetup && (
            <div className="space-y-3">
              <p className="text-xs text-sub">A verification code was sent to <span className="font-mono font-semibold">{smsSetup.phone_hint}</span>. Enter it to enable SMS MFA.</p>
              {demoCode && <p className="text-xs text-warnt bg-warnbg rounded px-3 py-2">Demo helper — the "texted" code is: <span className="font-mono font-bold">{demoCode.code}</span> (real SMS requires a provider; see server _send_sms hook)</p>}
              <form onSubmit={enable} className="flex gap-2">
                <TextInput value={code} onChange={e => setCode(e.target.value)} placeholder="6-digit code" className="font-mono" />
                <Button type="submit">Confirm</Button>
              </form>
            </div>
          )}
          {me.mfa_enabled && (
            <form onSubmit={disable} className="space-y-2">
              <Label>Enter a current code to disable MFA</Label>
              {me.mfa_method === "sms" && (
                <button type="button" onClick={async () => {
                  try { await api(apiBase, "/v1/auth/mfa/resend-sms", { method: "POST" });
                    api(apiBase, "/v1/auth/mfa/demo-code").then(setDemoCode).catch(() => {}); } catch (e2) {}
                }} className="text-xs text-accent hover:underline">Send me a code</button>
              )}
              {demoCode && me.mfa_method === "sms" && <p className="text-xs text-warnt bg-warnbg rounded px-3 py-2">Demo helper — code: <span className="font-mono font-bold">{demoCode.code}</span></p>}
              <div className="flex gap-2">
                <TextInput value={code} onChange={e => setCode(e.target.value)} placeholder="6-digit code" className="font-mono" />
                <Button type="submit" variant="danger">Disable</Button>
              </div>
            </form>
          )}

          {me.role === "admin" && (
            <div className="border-t border-line mt-5 pt-4">
              <h4 className="font-bold text-sm mb-1">User management <span className="text-[10px] font-bold text-accent bg-accentbg px-1.5 py-0.5 rounded ml-1">ADMIN</span></h4>
              <p className="text-xs text-sub mb-3">Roles: <b>admin</b> = everything · <b>billing</b> = full workspace · <b>viewer</b> = read-only</p>
              {umMsg && <p className="text-xs text-accent bg-accentbg rounded px-3 py-2 mb-2">{umMsg}</p>}
              <div className="space-y-2 mb-3">
                {users.map(u => (
                  <div key={u.username} className="flex items-center gap-2 bg-page rounded-lg px-3 py-2 text-sm">
                    <span className="font-semibold flex-1">{u.username}{u.mfa_enabled ? <span className="text-okt text-xs ml-1" title="MFA enabled">✓MFA</span> : null}</span>
                    <select value={u.role} onChange={e => changeRole(u.username, e.target.value)}
                      disabled={u.username === me.username}
                      className="bg-card border border-line rounded px-1.5 py-1 text-xs focus:outline-none">
                      <option value="admin">admin</option><option value="billing">billing</option><option value="viewer">viewer</option>
                    </select>
                    <button onClick={() => resetPassword(u.username)} className="text-xs text-accent hover:underline" title="Reset password">reset pw</button>
                    {u.username !== me.username && (
                      <button onClick={() => removeUser(u.username)} className="text-xs text-badt hover:underline">delete</button>
                    )}
                  </div>
                ))}
              </div>
              <form onSubmit={createUser} className="space-y-2">
                <div className="flex gap-2">
                  <TextInput required value={nu.username} onChange={e => setNu({ ...nu, username: e.target.value })} placeholder="new username" />
                  <TextInput required type="password" value={nu.password} onChange={e => setNu({ ...nu, password: e.target.value })} placeholder="password (8+)" />
                </div>
                <div className="flex gap-2">
                  <select value={nu.role} onChange={e => setNu({ ...nu, role: e.target.value })}
                    className="bg-card border border-line rounded-lg px-2 py-1.5 text-sm flex-1 focus:outline-none focus:border-accent">
                    <option value="billing">billing</option><option value="admin">admin</option><option value="viewer">viewer</option>
                  </select>
                  <Button type="submit">Add user</Button>
                </div>
              </form>
            </div>
          )}
        </div>
      </Card>
    </div>
  );
}

// ---------------------------------------------------------------- Audit Log
function AuditTab({ apiBase }) {
  const [events, setEvents] = useState([]);
  const [actorFilter, setActorFilter] = useState("");
  const [actionFilter, setActionFilter] = useState("");
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    api(apiBase, "/v1/oncology/audit?limit=500").then(setEvents).catch(e => setError(e.message));
  }, [apiBase]);
  useEffect(() => { load(); }, [load]);

  const actors = [...new Set(events.map(e => e.actor))].sort();
  const actions = [...new Set(events.map(e => e.action))].sort();
  const shown = events.filter(e =>
    (!actorFilter || e.actor === actorFilter) && (!actionFilter || e.action === actionFilter));

  const actorCounts = {};
  events.forEach(e => { actorCounts[e.actor] = (actorCounts[e.actor] || 0) + 1; });

  function exportCsv() {
    const head = "Timestamp,Actor,Action,Entity type,Entity ID,Detail";
    const body = shown.map(e => [e.ts, e.actor, e.action, e.entity_type, e.entity_id, `"${(e.detail || "").replaceAll('"', '""')}"`].join(","));
    const blob = new Blob([[head, ...body].join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "audit_log.csv";
    a.click();
  }

  const actionTone = a => a.includes("denied") || a.includes("denial") ? "bad"
    : a.includes("resolved") || a.includes("evidence") ? "ok"
    : a.includes("updated") ? "warn" : "blue";

  return (
    <div>
      <div className="flex items-start justify-between mb-4">
        <div>
          <h2 className="text-2xl font-bold">Audit log</h2>
          <p className="text-sm text-sub mt-1">Append-only record of every change — who did what, to which record, and when. 7-year retention per PRD v1.1 Section 12.</p>
        </div>
        <div className="flex gap-2">
          <Button variant="ghost" onClick={load}>Refresh</Button>
          <Button onClick={exportCsv}>↓ Export CSV</Button>
        </div>
      </div>
      <ErrorBanner msg={error} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <Card className="p-4">
          <div className="text-xs text-sub">Total events</div>
          <div className="text-3xl font-bold font-mono mt-1">{events.length}</div>
        </Card>
        {Object.entries(actorCounts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([actor, n]) => (
          <Card key={actor} className="p-4 cursor-pointer" >
            <div onClick={() => setActorFilter(actorFilter === actor ? "" : actor)}>
              <div className="text-xs text-sub">by {actor}</div>
              <div className={`text-3xl font-bold font-mono mt-1 ${actorFilter === actor ? "text-accent" : ""}`}>{n}</div>
              <div className="text-[11px] text-sub mt-0.5">tap to filter</div>
            </div>
          </Card>
        ))}
      </div>

      <Card>
        <div className="px-5 py-3 border-b border-line flex items-center gap-3 flex-wrap">
          <div className="w-44">
            <Select value={actorFilter} onChange={e => setActorFilter(e.target.value)}>
              <option value="">All actors</option>
              {actors.map(a => <option key={a} value={a}>{a}</option>)}
            </Select>
          </div>
          <div className="w-52">
            <Select value={actionFilter} onChange={e => setActionFilter(e.target.value)}>
              <option value="">All actions</option>
              {actions.map(a => <option key={a} value={a}>{a}</option>)}
            </Select>
          </div>
          <span className="text-xs text-sub ml-auto">{shown.length} of {events.length} events</span>
        </div>
        <div className="overflow-x-auto max-h-[560px] overflow-y-auto">
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-card">
              <tr className="text-left text-[11px] uppercase tracking-wider text-sub border-b border-line">
                <th className="px-5 py-2.5">When (UTC)</th><th className="pr-3">Who</th><th className="pr-3">Action</th>
                <th className="pr-3">Record</th><th className="pr-3">Detail</th>
              </tr>
            </thead>
            <tbody>
              {shown.map(e => (
                <tr key={e.id} className="border-b border-line hover:bg-hoverbg">
                  <td className="px-5 py-2.5 font-mono text-xs text-sub whitespace-nowrap">{String(e.ts).slice(0, 19).replace("T", " ")}</td>
                  <td className="pr-3"><Pill tone={e.actor === "system" || e.actor === "seed" ? "gray" : "blue"}>{e.actor}</Pill></td>
                  <td className="pr-3"><Pill tone={actionTone(e.action)}>{e.action}</Pill></td>
                  <td className="pr-3 font-mono text-xs whitespace-nowrap">{e.entity_type} · {e.entity_id}</td>
                  <td className="pr-3 text-xs text-sub max-w-[320px] truncate" title={e.detail}>{e.detail}</td>
                </tr>
              ))}
              {shown.length === 0 && <tr><td colSpan="5" className="px-5 py-4 text-sub text-sm">No events match this filter.</td></tr>}
            </tbody>
          </table>
        </div>
      </Card>
      <p className="text-xs text-sub mt-3">System and seed events are automated; named actors come from the "Your name" field in the header. Records are append-only — corrections appear as new events, never edits.</p>
    </div>
  );
}

const ACCENTS = [
  { id: "blue", dot: "#2F5FE3" },
  { id: "indigo", dot: "#6D28D9" },
  { id: "orange", dot: "#EA580C" },
];

function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [tab, setTab] = useState("previsit");
  const [refreshKey, setRefreshKey] = useState(0);
  const [counts, setCounts] = useState({ appeals: 0, exceptions: 0 });
  const [accent, setAccent] = useState(() => {
    const a = localStorage.getItem("ng_accent");
    return a === "slate" ? "orange" : (a || "blue");  // migrate old slate choice
  });
  const [dark, setDark] = useState(() => localStorage.getItem("ng_dark") === "1");
  const [userName, setUserName] = useState(() => localStorage.getItem("ng_user") || "");
  const [navReq, setNavReq] = useState(null);
  const [authToken, setAuthToken] = useState(() => localStorage.getItem("ng_token") || "");
  const [me, setMe] = useState(null);
  const [showAccount, setShowAccount] = useState(false);

  function go(targetTab, payload) {
    setNavReq({ tab: targetTab, ...payload, token: Date.now() });
    setTab(targetTab);
  }

  useEffect(() => { localStorage.setItem("ng_user", userName); }, [userName]);

  const loadMe = useCallback(() => {
    if (!authToken) { setMe(null); return; }
    api(apiBase, "/v1/auth/me").then(setMe).catch(() => {
      // Session invalid (e.g. server restarted, token expired) -> force login
      setMe(null);
      localStorage.removeItem("ng_token");
      setAuthToken("");
    });
  }, [apiBase, authToken]);
  useEffect(() => { loadMe(); }, [loadMe]);

  useEffect(() => {
    const h = () => setAuthToken("");
    window.addEventListener("ng-auth-expired", h);
    return () => window.removeEventListener("ng-auth-expired", h);
  }, []);

  function handleLogin(token, username) {
    localStorage.setItem("ng_token", token);
    localStorage.setItem("ng_user", username);
    setUserName(username);
    setAuthToken(token);
  }
  function signOut() {
    localStorage.removeItem("ng_token");
    setAuthToken("");
    setMe(null);
  }

  useEffect(() => {
    document.body.dataset.accent = accent;
    document.body.classList.toggle("dark", dark);

                <button key={a.id} onClick={() => setAccent(a.id)} title={a.id}
                  className={`rounded-full transition ${accent === a.id ? "ring-2 ring-offset-1 ring-accent" : ""}`}
                  style={{ backgroundColor: a.dot, width: 16, height: 16 }}></button>
              ))}
            </div>
            <button onClick={() => setDark(d => !d)} title={dark ? "Light mode" : "Dark mode"}
              className="w-8 h-8 rounded-full bg-page border border-line flex items-center justify-center text-sub hover:text-ink transition shrink-0">
              {dark
                ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" strokeLinecap="round"/></svg>
                : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </button>
            <button onClick={signOut} title="Sign out"
              className="flex-1 text-[11px] text-sub hover:text-badt font-semibold text-right pr-1">Sign out</button>
          </div>

          <div>
            <div className="text-[10px] uppercase tracking-wider text-sub font-semibold mb-1">API</div>
            <input value={apiBase} onChange={e => setApiBase(e.target.value)}
              className="w-full bg-page border border-line rounded-lg px-2 py-1.5 font-mono text-[10px] focus:outline-none focus:border-accent" />
          </div>

          <div className="text-[10px] text-sub pt-1">Fictional demo data · no PHI</div>
        </div>
      </aside>

      {/* ---- main column ---- */}
      <div className="flex-1 min-w-0">
      <div className="bg-warnbg text-warnt text-center text-xs font-semibold py-1.5 px-4">
        Demonstration environment — all data is fictional · not for clinical or billing use · do not enter PHI
      </div>
      <header className="bg-card border-b border-line sticky top-0 z-10">
        <div className="px-6 h-16 flex items-center gap-5">
          <nav className="flex items-center gap-0.5 flex-1 min-w-0 overflow-x-auto">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 whitespace-nowrap transition ${tab === t.id ? "bg-accentbg text-accent" : "text-sub hover:text-ink"}`}>
                {t.label}
                {t.count > 0 && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${tab === t.id ? "bg-accent text-white" : "bg-chip text-sub"}`}>{t.count}</span>}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="px-6 py-6">
        {tab === "previsit" && <PrevisitTab apiBase={apiBase} onExceptionsChanged={() => setRefreshKey(k => k + 1)} navReq={navReq} go={go} />}
        {tab === "denial" && <DenialTab apiBase={apiBase} navReq={navReq} go={go} />}
        {tab === "eligibility" && <EligibilityTab apiBase={apiBase} go={go} />}
        {tab === "coverage" && <CoverageTab apiBase={apiBase} navReq={navReq} go={go} />}
        {tab === "analytics" && <AnalyticsTab apiBase={apiBase} />}
        {tab === "appeals" && <AppealsTab apiBase={apiBase} go={go} />}
        {tab === "exceptions" && <ExceptionsTab apiBase={apiBase} refreshKey={refreshKey} navReq={navReq} go={go} />}
        {tab === "edi" && <EdiTab apiBase={apiBase} onDataChanged={() => setRefreshKey(k => k + 1)} />}
        {tab === "connect" && <ConnectTab apiBase={apiBase} go={go} />}
        {tab === "fhir" && <FhirTab apiBase={apiBase} go={go} />}
        {tab === "validation" && <ValidationTab apiBase={apiBase} />}
        {tab === "audit" && <AuditTab apiBase={apiBase} />}
      </main>

      {showAccount && me && (
        <AccountPanel apiBase={apiBase} me={me} onClose={() => setShowAccount(false)} onChanged={loadMe} />
      )}

      <footer className="px-6 pb-6 text-xs text-sub">
        Demo build with fictional data — L0/L1 rule checks are deterministic; risk scoring, NLP, and drafted appeals use clearly-labeled heuristic stand-ins pending real model training (PRD v1.1).
      </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
